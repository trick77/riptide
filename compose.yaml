services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: riptide
      POSTGRES_PASSWORD: riptide
      POSTGRES_DB: riptide
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riptide -d riptide"]
      interval: 2s
      timeout: 2s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Containerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      RIPTIDE_DB_URL: postgres://riptide:riptide@db:5432/riptide?sslmode=disable
    command: ["migrate"]

  app:
    build:
      context: .
      dockerfile: backend/Containerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RIPTIDE_DB_URL: postgres://riptide:riptide@db:5432/riptide?sslmode=disable
      RIPTIDE_CONFIG_PATH: /etc/riptide-collector/riptide.json
      RIPTIDE_TEAM_KEYS_PATH: /etc/riptide-collector/team-keys.json
      RIPTIDE_LOG_LEVEL: INFO
    volumes:
      - ./openshift/collector/riptide.json:/etc/riptide-collector/riptide.json:ro
      # Dev-only raw keys, one per team and source (team-keys.json stores the
      # raw tokens, not hashes). Production mounts its own file from a Secret.
      # Use them as `Authorization: Bearer <key>`, e.g. the checkout jenkins
      # key against /webhooks/pipeline.
      - ./openshift/collector/team-keys.json:/etc/riptide-collector/team-keys.json:ro
    ports:
      - "8000:8000"
