version: 2
updates:
  - package-ecosystem: gomod
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: weekly
