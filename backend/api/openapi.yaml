openapi: 3.1.0

info:
  title: riptide API
  # The CONTRACT's version, not the binary's. The two move independently:
  # a release that changes no route leaves this alone.
  version: 2.3.0
  description: |
    DevOps delivery-metrics ingestion. Senders post raw events from Bitbucket
    Data Center, CI pipelines (Jenkins, Tekton, ...), Argo CD and noergler;
    riptide stores them append-only in Postgres. Metrics are computed on read.

    ## Authentication

    Every sender authenticates as its team, and the team on every stored row
    is the caller's team, never a field of the payload.

    - `/webhooks/pipeline`, `/webhooks/argocd`, `/webhooks/noergler` and
      `/auth/ping` take the team's source-specific key as a bearer token. A key
      authenticates only its own source: an `argocd` key cannot post to
      `/webhooks/pipeline`. `/auth/ping` accepts any of the team's keys.
    - `/webhooks/bitbucket/{team}` is HMAC-signed by Bitbucket with the team's
      `bitbucket` key (`X-Hub-Signature: sha256=<hex>`).
    - `/onboard/{team}` takes the team's `bitbucket` key as a bearer token.

    ## Idempotency

    Every event has a delivery id, and a redelivery of the same id is
    acknowledged with `202 accepted` and not stored twice.

    ## Validation

    The pipeline, Argo CD and noergler contracts are strict: an invalid body is
    a `422`. An optional field sent as `""` is treated as absent. Bitbucket
    bodies are read permissively; a delivery riptide does not store is
    answered `202 ignored` with the reason.

servers:
  - url: /
    description: |
      This riptide instance. The webhooks and /auth/ping are on the collector
      listener (this page's); /api is on the UI listener only, so try it
      there, not here.

tags:
  - name: webhooks
    description: Event sinks.
  - name: onboarding
    description: The team's Bitbucket webhooks, self-service.
  - name: health
    description: Sender self-checks and this document. The liveness and readiness probes (/healthz, /readyz) answer loopback callers only and are not part of this contract.
  - name: read
    description: |
      The UI's read API. Served on the UI listener only (`BACKEND_UI_ADDR`,
      loopback by default, behind the auth proxy), never on the collector's
      listener that takes the webhooks. Every number is computed here, on
      read: the UI renders and formats, it computes nothing.

paths:
  /webhooks/bitbucket/{team}:
    post:
      tags: [webhooks]
      operationId: bitbucketWebhook
      summary: Bitbucket Data Center webhook sink (HMAC-authenticated)
      description: |
        Bitbucket signs each delivery with the team's `bitbucket` key; the team
        is the path segment. The body is read permissively and stored as
        received, with the join identifiers extracted and lowercased.
      security: [{ bitbucketSignature: [] }]
      parameters:
        - name: team
          in: path
          required: true
          description: The team whose `bitbucket` key signs the delivery.
          schema: { type: string, minLength: 1 }
        - name: X-Event-Key
          in: header
          required: false
          description: Bitbucket's event key, e.g. `pr:merged`, `repo:refs_changed`.
          schema: { type: string }
        - name: X-Request-Id
          in: header
          required: false
          description: |
            Bitbucket's per-delivery id, used as the delivery id.
            `X-Request-UUID` is accepted as well. Without either, the delivery
            id is derived from the event key and the body.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The Bitbucket Data Center webhook body, stored as received.
      responses:
        "202":
          description: |
            Accepted (stored, or a redelivery of a stored event), or ignored:
            not a JSON object, the "Test connection" ping, a `pr:modified`
            that is not a draft-to-ready flip, or a push with no branch change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/pipeline:
    post:
      tags: [webhooks]
      operationId: pipelineWebhook
      summary: CI pipeline webhook sink (Jenkins, Tekton, ...)
      description: |
        Every CI lands here, told apart by `source`. Authenticated with the
        team's `jenkins` key. The delivery id is
        `source#pipeline_name#run_id#phase`.
      security: [{ teamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineEvent" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/argocd:
    post:
      tags: [webhooks]
      operationId: argocdWebhook
      summary: Argo CD notification sink
      description: |
        Authenticated with the team's `argocd` key. A deploy to a stage listed
        in the config's `environments.ignored_stages` is answered
        `202 ignored` and not stored.
      security: [{ teamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArgoCDEvent" }
      responses:
        "202":
          description: Accepted, or ignored for an ignored stage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/noergler:
    post:
      tags: [webhooks]
      operationId: noerglerWebhook
      summary: Noergler PR-review sink (per-PR rollup and reviewer precision)
      description: |
        Authenticated with the team's `noergler` key. Unknown fields are a
        `422`. Delivery ids: `pr_completed#<pr_key>#<outcome>` and
        `feedback#<finding_id>#<verdict>`. A declined PR that is reopened and
        merged sends a second, cumulative `pr_completed`.
      security: [{ teamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/NoerglerPrCompleted"
                - $ref: "#/components/schemas/NoerglerFeedback"
              discriminator:
                propertyName: event_type
                mapping:
                  pr_completed: "#/components/schemas/NoerglerPrCompleted"
                  feedback: "#/components/schemas/NoerglerFeedback"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /onboard/{team}:
    post:
      tags: [onboarding]
      operationId: onboard
      summary: Put the team's Bitbucket webhook on projects and repos, report or remove it
      description: |
        A project without `repos` gets one project webhook, which covers every
        repo in it, new ones included; onboarding it deletes the team's repo
        webhooks below it, which would deliver every event a second time. A
        project with `repos` gets one repo webhook each (a personal `~USER`
        project, or one only partly the team's); a repo under the team's
        project webhook is skipped, and one whose project's webhooks the
        caller cannot read fails (a project webhook there would double it).
        A repo listed under a project also listed whole is a `422`. A second
        webhook of the team's on one target is deleted.

        The webhook is named `riptide` and delivers to
        `<BACKEND_PUBLIC_URL>/webhooks/bitbucket/{team}`, signed with the
        team's `bitbucket` key. A `riptide` webhook delivering to this team's
        path on any host is the team's and is rewritten (a host move is one
        `onboard`); one delivering to another team's path is left alone, the
        team's own goes next to it.

        Authenticated with the team's `bitbucket` key as a bearer. The
        Bitbucket calls run on the caller's own token in `X-Bitbucket-Token`
        (admin on the targets), for this request only, never stored. A
        Bitbucket failure is a row with status `failed`; the other targets
        still run. Off (`503`) without `BACKEND_PUBLIC_URL` and
        `BACKEND_BITBUCKET_URL`.
      security: [{ teamKey: [] }]
      parameters:
        - name: team
          in: path
          required: true
          description: The team the bearer key belongs to.
          schema: { type: string, minLength: 1 }
        - name: X-Bitbucket-Token
          in: header
          required: true
          description: The caller's Bitbucket HTTP access token, admin on the projects or repos.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardRequest" }
      responses:
        "200":
          description: Every target, in the order given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardResult" }
        "400":
          description: "`X-Bitbucket-Token` missing, or the body unreadable."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: The body is invalid; the detail says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Onboarding is off on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/ping:
    get:
      tags: [health]
      operationId: authPing
      summary: Authenticated reachability check for senders
      description: |
        Senders call it at startup so a wrong key fails fast. Any of the
        team's keys authenticates; the answer names the team.
      security: [{ teamKey: [] }]
      responses:
        "200":
          description: The key is valid.
          content:
            application/json:
              schema:
                type: object
                required: [status, team]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }
                  team: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /openapi.yaml:
    get:
      tags: [health]
      operationId: openapiSpec
      summary: This document
      description: The contract as embedded in the running binary.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "304":
          description: Not modified since the ETag sent in If-None-Match.

  /docs:
    get:
      tags: [health]
      operationId: docs
      summary: Swagger UI for this document
      description: Loads Swagger UI from a CDN and points it at /openapi.yaml.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /api/teams:
    get:
      tags: [read]
      operationId: teams
      summary: The configured teams
      description: The teams in the config, sorted, for the UI's team picker. Served on the UI listener only.
      security: []
      responses:
        "200":
          description: The team names.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [teams]
                properties:
                  teams: { type: array, items: { type: string } }

  /api/metrics:
    get:
      tags: [read]
      operationId: metrics
      summary: Every number of one team's page
      description: |
        Delivery, lead-time breakdown, code review, builds with their
        hotspots, and noergler costs of the team over the period: whole
        calendar weeks in the viewer's zone, the current one running to now.
        The rules are the metric queries in docs/metrics.md. Product = Bitbucket
        project key, the part of a repository's name before `/`; an App's
        product is that of the GitOps repo its revision is a commit of.

        No authentication of its own: the UI listener is reached through the
        auth proxy only.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReadTeam"
        - $ref: "#/components/parameters/ReadWeeks"
        - $ref: "#/components/parameters/ReadTZ"
        - $ref: "#/components/parameters/ReadProduct"
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "404": { $ref: "#/components/responses/ReadUnknownTeam" }
        "422": { $ref: "#/components/responses/ReadBadQuery" }
        "500": { $ref: "#/components/responses/ReadFailed" }

  /api/facts:
    get:
      tags: [read]
      operationId: facts
      summary: The single facts behind the numbers, searched
      description: |
        The team's PRs, deploys and CI runs of the period, newest first,
        filtered by product (bots' PRs left out) and a case-insensitive search;
        each table the first 300 matches and how many matched.

        No authentication of its own: the UI listener is reached through the
        auth proxy only.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReadTeam"
        - $ref: "#/components/parameters/ReadWeeks"
        - $ref: "#/components/parameters/ReadTZ"
        - name: product
          in: query
          required: false
          description: |
            A product key, applied as given: one without rows matches none.
            Send the `product` /api/metrics answered; the facts read no lead
            times or reviews, so they cannot tell every product the page knows.
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: Search text; empty matches everything.
          schema: { type: string }
      responses:
        "200":
          description: The facts tables.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facts" }
        "404": { $ref: "#/components/responses/ReadUnknownTeam" }
        "422": { $ref: "#/components/responses/ReadBadQuery" }
        "500": { $ref: "#/components/responses/ReadFailed" }

  /api/analysis:
    get:
      tags: [read]
      operationId: analysis
      summary: The overview's assessment and its LLM wording
      description: |
        The patterns the team's numbers raise over its last closed weeks
        (never the running one), the repos that move most and where the CI
        time went, and the LLM's wording of them where there is one for the
        view: the newest of the same window, within its schedule's age.
        Every number and verdict is riptide's; the text refers to numbers
        as `{{fact id}}` placeholders. The weeks are the analysis' calendar
        (BACKEND_ANALYSIS_TZ), whatever `tz` says, so one stored analysis
        serves every viewer.

        No authentication of its own: the UI listener is reached through the
        auth proxy only.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReadTeam"
        - $ref: "#/components/parameters/ReadWeeks"
        - $ref: "#/components/parameters/ReadTZ"
        - $ref: "#/components/parameters/ReadProduct"
      responses:
        "200":
          description: The assessment, worded where there is an analysis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisStatus" }
        "404": { $ref: "#/components/responses/ReadUnknownTeam" }
        "422": { $ref: "#/components/responses/ReadBadQuery" }
        "500": { $ref: "#/components/responses/ReadFailed" }
    post:
      tags: [read]
      operationId: askAnalysis
      summary: Word the view's assessment now
      description: |
        Starts an LLM run for the view in the background and answers with
        its status, `running` set; poll GET until it is not. One per view
        at a time and per ten minutes, whoever asks: the UI listener knows
        nobody; ten per hour across all views. Unchanged input is not asked
        again. Send `X-Riptide-Ask: 1`: a cross-site form cannot, so it cannot
        spend.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReadTeam"
        - $ref: "#/components/parameters/ReadWeeks"
        - $ref: "#/components/parameters/ReadTZ"
        - $ref: "#/components/parameters/ReadProduct"
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisStatus" }
        "403":
          description: "`X-Riptide-Ask: 1` missing."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/ReadUnknownTeam" }
        "409":
          description: |
            A run of the view is under way or was asked for within ten
            minutes, the hour's ten runs are taken, or no model is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`team` missing, `weeks` or `tz` unreadable, or a `product` the team's data does not know."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ReadFailed" }

components:
  securitySchemes:
    teamKey:
      type: http
      scheme: bearer
      description: The team's key for this source, from team-keys.json.
    bitbucketSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature
      description: "`sha256=<hex>` HMAC of the body with the team's `bitbucket` key."

  responses:
    Unauthorized:
      description: Missing, malformed or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The body exceeds the limit (1 MiB; 10 MiB for Bitbucket).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: The event could not be stored. Retry; the retry dedupes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The body failed validation. Every failing field is listed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    ReadUnknownTeam:
      description: The team is not in the config.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReadBadQuery:
      description: "`team` missing, or `weeks` or `tz` unreadable."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReadFailed:
      description: The database could not be read.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    ReadTeam:
      name: team
      in: query
      required: true
      description: A team from the config's `teams`.
      schema: { type: string, minLength: 1 }
    ReadWeeks:
      name: weeks
      in: query
      required: false
      description: The period in calendar weeks, the current one running to now. Default 4.
      schema: { type: integer, enum: [4, 12, 26] }
    ReadTZ:
      name: tz
      in: query
      required: false
      description: The viewer's IANA time zone; weeks run Monday 00:00 to Monday 00:00 there. Default UTC.
      schema: { type: string, examples: [Europe/Zurich] }
    ReadProduct:
      name: product
      in: query
      required: false
      description: A product key; one without data in the period, or none, is all products.
      schema: { type: string }

  schemas:
    Error:
      type: object
      required: [detail]
      additionalProperties: false
      properties:
        detail: { type: string }

    ValidationError:
      type: object
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          type: array
          items:
            type: object
            required: [type, loc, msg]
            additionalProperties: false
            properties:
              type: { type: string, description: "e.g. missing, string_too_short, extra_forbidden" }
              loc:
                type: array
                items: { type: string }
                description: '`["body"]` or `["body", "<field>"]`.'
              msg: { type: string }

    OnboardRequest:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [status, onboard, remove]
          default: status
          description: "`status` writes nothing."
        projects:
          type: array
          minItems: 1
          items:
            type: object
            required: [key]
            additionalProperties: false
            properties:
              key: { type: string, minLength: 1, examples: [PLAT, "~JDOE"] }
              repos:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
                description: Repo slugs; absent is the whole project.
        dry_run:
          type: boolean
          default: false
          description: Report what onboard or remove would write; write nothing.

    OnboardResult:
      type: object
      required: [team, action, dry_run, webhook_url, healthy, rows, text]
      additionalProperties: false
      properties:
        team: { type: string }
        action: { type: string, enum: [status, onboard, remove] }
        dry_run: { type: boolean }
        webhook_url: { type: string, description: Where the team's webhooks deliver. }
        healthy:
          type: boolean
          description: With status every row ok; with onboard and remove no row failed.
        rows:
          type: array
          items:
            type: object
            required: [target, level, status, detail, diff, repo_hooks, foreign]
            additionalProperties: false
            properties:
              target: { type: string, examples: [PLAT, PLAT/repo] }
              level: { type: string, enum: [project, repo] }
              status:
                type: string
                enum: [ok, stale, missing, foreign, double, skipped, failed]
                description: |
                  status: ok, stale (onboard rewrites it), missing, foreign
                  (only another team's webhook; onboard adds the team's own),
                  double (a project and a repo
                  webhook both deliver) or failed. onboard and remove: ok,
                  skipped or failed.
              detail: { type: string }
              diff:
                type: array
                items: { type: string }
                description: What onboard changes or changed; `create` for a new webhook.
              repo_hooks:
                type: array
                items: { type: string }
                description: Under a project, the repos with a webhook of the team's own besides the project's; onboard deletes them.
              foreign:
                type: array
                items: { type: string }
                description: "`riptide` webhooks under the target delivering to another team, left alone."
        text: { type: string, description: The rows as a plain table. }

    WebhookResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [accepted, ignored] }
        reason: { type: string, description: Why a Bitbucket delivery was not stored. }

    Timestamp:
      description: |
        ISO 8601; without an offset it is taken as UTC. Unix epoch seconds
        (milliseconds above 2e10) are accepted as well.
      oneOf:
        - type: string
        - type: number

    AccountKind:
      type: string
      enum: [bot, service, human]
      description: |
        What the reported account is: `bot` acts on its own (a review bot,
        Renovate), `service` is a technical account a system acts through (a
        CI user pushing merges), `human` is a person and is counted as one.

    PipelineEvent:
      type: object
      description: Unknown fields are allowed and kept in the stored payload.
      required: [source, pipeline_name, run_id, phase, started_at]
      properties:
        source: { type: string, minLength: 1, description: "CI system: jenkins, tekton, ..." }
        pipeline_name: { type: string, minLength: 1, description: Jenkins job / Tekton pipeline name. }
        run_id: { type: string, minLength: 1, description: Jenkins build number / Tekton PipelineRun name. }
        phase: { type: string, minLength: 1, description: STARTED / COMPLETED / FINALIZED. }
        status: { type: [string, "null"], description: SUCCESS / FAILURE / ... }
        commit_sha:
          type: [string, "null"]
          # Blank, or 7 characters or more once trimmed (stored trimmed,
          # lowercased); the same for head_sha and base_sha.
          pattern: '^\s*$|^\s*\S.{5,}\S\s*$'
          description: |
            The App-repo commit being built, 7 characters or more. Absent,
            null or blank (whitespace only) for a run that failed before its
            checkout (no agent, a git timeout): still a run, counted as red,
            never flaky (nothing to pair it on).
        head_sha:
          type: [string, "null"]
          pattern: '^\s*$|^\s*\S.{5,}\S\s*$'
          description: |
            A PR build's own head, 7 characters or more, when `commit_sha` is
            a merge the CI made of the PR with its target branch (Jenkins'
            Bitbucket Branch Source, "merge with the target"): that merge
            commit is new on every build and unknown to Bitbucket. Finds the
            run's repository. Absent, null or blank: none.
        base_sha:
          type: [string, "null"]
          pattern: '^\s*$|^\s*\S.{5,}\S\s*$'
          description: |
            With `head_sha`: the target branch's tip the merge was made onto,
            7 characters or more. Head and base are the code built: a rerun
            on both is the same code (flaky runs), the same head on a moved
            target is not. A head without a base is never paired.
        image_ref:
          type: [string, "null"]
          description: |
            Full image reference the run published (`registry/path:tag`). Argo
            CD reports the same strings, which makes deploy -> build -> commit an
            exact join. Omit it (or send "") for runs that publish no image. A
            run that publishes several sends `image_refs`; both may be sent and
            are merged.
        image_refs:
          type: [array, "null"]
          items: { type: string }
          description: |
            Every image the run published, for a run that pushes more than
            one (a monorepo building several apps, a multi-module service).
            Stays one event per run, so build counts and CI time are not
            multiplied. Merged with `image_ref`, trimmed and deduplicated;
            empty entries are ignored.
        actor_handle:
          type: [string, "null"]
          description: The git-host account this CI acts through.
        actor_account_kind:
          $ref: "#/components/schemas/AccountKind"
          default: service
        build_type:
          type: [string, "null"]
          description: |
            What kind of build the run was, as the pipeline reports it
            (`release`, `hotfix`, `build`, ...). Sent on COMPLETED. Free text,
            stored trimmed and lowercased; "" is absent.
        started_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the CI started the run, before it waited for a build agent.
        agent_started_at:
          description: |
            When the run got its build agent. `started_at` to here is the
            wait for one, which grows with cluster load and is no build time;
            the metrics show it apart from the build. Optional; on STARTED
            is enough, a COMPLETED without it takes the run's STARTED value.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ArgoCDEvent:
      type: object
      description: Unknown fields are allowed and kept in the stored payload.
      required: [app_name, revision, images]
      properties:
        app_name: { type: string, minLength: 1 }
        revision: { type: string, minLength: 7, description: The GitOps-repo SHA being deployed. }
        sync_status: { type: [string, "null"] }
        operation_phase: { type: [string, "null"], description: Succeeded / Failed / Running. }
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        destination_namespace:
          type: [string, "null"]
          description: The namespace deployed into; its suffix after the last `-` is the environment.
        images:
          type: array
          items: { type: string }
          description: |
            Rendered images of the synced manifests
            (`.app.status.summary.images`), possibly empty. They match
            entries of `pipeline_events.image_refs` verbatim. Tags are versions: never
            parse a commit SHA out of one.

    NoerglerPrCompleted:
      type: object
      additionalProperties: false
      required:
        - event_type
        - outcome
        - pr_key
        - repo
        - source_commit_sha
        - lines_added
        - lines_removed
        - files_changed
        - total_runs
        - total_prompt_tokens
        - total_completion_tokens
        - total_elapsed_ms
        - total_findings_count
        - models_used
        - first_review_at
        - closed_at
      properties:
        event_type: { type: string, const: pr_completed }
        outcome:
          type: string
          enum: [merged, declined, deleted]
          description: Only merged PRs reach production.
        pr_key: { type: string, minLength: 1, description: "Bitbucket PR key, e.g. PROJ/repo#42." }
        repo: { type: string, minLength: 1 }
        reviewer_handle:
          type: [string, "null"]
          description: The git-host account the reviewer posts its comments under.
        reviewer_account_kind:
          $ref: "#/components/schemas/AccountKind"
          default: bot
        source_commit_sha: { type: string, minLength: 7 }
        merge_commit_sha:
          type: [string, "null"]
          minLength: 7
          description: Required when outcome is merged, null otherwise.
        lines_added: { type: integer, minimum: 0 }
        lines_removed: { type: integer, minimum: 0 }
        files_changed: { type: integer, minimum: 0 }
        total_runs: { type: integer, minimum: 1 }
        total_prompt_tokens: { type: integer, minimum: 0 }
        total_completion_tokens: { type: integer, minimum: 0 }
        total_elapsed_ms: { type: integer, minimum: 0 }
        total_findings_count: { type: integer, minimum: 0 }
        total_cost_usd:
          type: [number, string, "null"]
          description: |
            Aggregated review cost, below 1000000 with up to six decimals kept.
            Omit it when the run cannot be priced; never send 0, which would
            understate FinOps.
        models_used:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        first_review_at: { $ref: "#/components/schemas/Timestamp" }
        closed_at: { $ref: "#/components/schemas/Timestamp" }

    NoerglerFeedback:
      type: object
      additionalProperties: false
      required: [event_type, pr_key, finding_id, verdict, actor, occurred_at]
      properties:
        event_type: { type: string, const: feedback }
        pr_key: { type: string, minLength: 1 }
        finding_id:
          type: string
          minLength: 1
          description: Stable opaque id of the finding; not normalised.
        verdict: { type: string, enum: [disagreed, acknowledged] }
        actor: { type: string, minLength: 1 }
        repo: { type: [string, "null"], minLength: 1 }
        commit_sha: { type: [string, "null"], minLength: 7 }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }

    Instant:
      type: string
      format: date-time
      description: RFC 3339, UTC.

    NullableInstant:
      type: [string, "null"]
      format: date-time
      description: RFC 3339, UTC; null when it did not happen (yet).

    NullableNumber:
      type: [number, "null"]
      description: Null when there is nothing to compute it from.

    Seconds:
      type: number
      description: A duration in seconds.

    NullableSeconds:
      type: [number, "null"]
      description: A duration in seconds; null when unknown or negative.

    Spread:
      type: object
      description: A sample's size, median and 90th percentile (Postgres percentile_cont); null percentiles on no values.
      additionalProperties: false
      required: [n, p50, p90]
      properties:
        n: { type: integer, minimum: 0 }
        p50: { $ref: "#/components/schemas/NullableNumber" }
        p90: { $ref: "#/components/schemas/NullableNumber" }

    RunKind:
      type: string
      enum: [release, main, feature, other, unknown]
      description: |
        `release`: build_type release or hotfix; `main`: the default branch
        (master or main), no release; `feature`: every prefix the work mix
        knows but docs (feature/, feat/, bugfix/, fix/, hotfix/, chore/,
        refactor/) and PR-<n>; `other`: any other branch, docs/ and doc/
        included (their pipelines often skip the build);
        `unknown`: a default-branch run before the team's first build_type,
        release or not.

    Metrics:
      type: object
      additionalProperties: false
      required: [meta, period, products, product, delivery, lead_chain, review, open_prs, build, costs,
                 comparison]
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
        period: { $ref: "#/components/schemas/Period" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        product:
          type: [string, "null"]
          description: The product shown; null for all, also when the one asked for has no data in the period.
        delivery: { $ref: "#/components/schemas/Delivery" }
        lead_chain: { $ref: "#/components/schemas/LeadChain" }
        review: { $ref: "#/components/schemas/Review" }
        open_prs: { $ref: "#/components/schemas/OpenPRs" }
        build: { $ref: "#/components/schemas/Build" }
        costs: { $ref: "#/components/schemas/Costs" }
        comparison: { $ref: "#/components/schemas/Comparison" }

    Change:
      type: object
      description: |
        A number against the previous period. Durations and rates count as
        the same within 10 % of the previous value, shares within 3 points.
      additionalProperties: false
      required: [prev, verdict, reason, directed, score, magnitude]
      properties:
        directed:
          type: boolean
          description: |
            The number has a better direction, whatever the verdict: an
            undirected one with too few data says `low_sample`, not
            `undirected`.
        prev:
          $ref: "#/components/schemas/NullableNumber"
          description: The previous period's value; null when the periods do not compare.
        score:
          type: [number, "null"]
          minimum: -1
          maximum: 1
          description: |
            The change's size, positive better: log2(current / previous),
            negated where lower is better, clamped to -1..1 (halving,
            doubling). From 0 to anything is ±1, 0 to 0 is 0. Shares score
            linearly, 25 points = ±1: a ratio near 0 % or 100 % explodes on
            a change within the 3 points that count as the same. A count
            (jammed repos) adds 2 to both sides first, so one more is no
            doubling. 0 when the verdict is same (within the tolerance the
            change is noise), null when it is none.
        verdict: { type: string, enum: [better, worse, same, none] }
        reason:
          type: [string, "null"]
          enum: [low_sample, incomplete, no_value, undirected, not_reporting, null]
          description: |
            Why the verdict is none. `low_sample`: too few in one of the
            periods. `incomplete`: the previous period starts before its
            source's data, or a period has more first deploys than releases.
            `no_value`: a value missing. `undirected`: no better direction;
            `prev` is set. `not_reporting`: the source (Argo CD, for the
            deploy numbers) does not report for the team yet.
        magnitude:
          type: [string, "null"]
          enum: [same, minor, notable, null]
          description: |
            How far it moved: `same` within the tolerance, `notable` past 25 %
            (5 points for a share, counts damped as for the score), `minor`
            between. Undirected numbers have one too. Null when the verdict is
            none for any reason but `undirected`.

    Comparison:
      type: object
      description: The page's numbers against the same number of whole weeks right before the period.
      additionalProperties: false
      required: [from, to, deploy_frequency, deploy_success, lead_time, lead_time_pre, review_time, within_day,
                 first_touch, untracked, cost_per_kloc, wasted_share, build, open_prs, open_jammed]
      properties:
        from: { $ref: "#/components/schemas/Instant" }
        to: { $ref: "#/components/schemas/Instant" }
        deploy_frequency: { $ref: "#/components/schemas/Change" }
        deploy_success: { $ref: "#/components/schemas/Change" }
        lead_time: { $ref: "#/components/schemas/Change" }
        lead_time_pre:
          oneOf:
            - { $ref: "#/components/schemas/Change" }
            - { type: "null" }
        review_time: { $ref: "#/components/schemas/Change" }
        within_day: { $ref: "#/components/schemas/Change" }
        first_touch: { $ref: "#/components/schemas/Change" }
        untracked: { $ref: "#/components/schemas/Change" }
        cost_per_kloc: { $ref: "#/components/schemas/Change" }
        wasted_share: { $ref: "#/components/schemas/Change" }
        build:
          type: array
          description: |
            Per kind of run of the period, against the previous period's runs
            of the same kind. No median duration of the kind: a kind mixes
            toolchains, so its repos count each against its own instead.
          items:
            type: object
            additionalProperties: false
            required: [kind, success, flaky, slower, failing_more, compared]
            properties:
              kind: { $ref: "#/components/schemas/RunKind" }
              success: { $ref: "#/components/schemas/Change" }
              flaky:
                $ref: "#/components/schemas/Change"
                description: BuildStats' `flaky_rate` against the previous period's, lower better.
              slower: { type: integer, description: Repos of the kind flagged slow (see Hotspots). }
              failing_more: { type: integer, description: Repos of the kind flagged failing more. }
              compared:
                type: integer
                description: Repos of the kind with enough runs in both periods to compare, every one, not only the listed.
        open_prs:
          $ref: "#/components/schemas/Change"
          description: PRs open at the period's end against those at the previous one's end; undirected.
        open_jammed:
          $ref: "#/components/schemas/Change"
          description: Jammed repos at the period's end against the previous one's end; fewer is better.

    PRWaiting:
      type: string
      enum: [draft, first_review, review, changes, merge, inactive]
      description: |
        What an open PR waits on, the first that applies: `inactive` no
        event for `inactive_days` (a PR nobody touches and one whose close
        event was lost look alike), in the PR table only; `draft` still a
        draft; `changes` a reviewer asked for changes (Bitbucket's status
        on its latest event); `merge` approved, not merged; `review` a
        reviewer touched it; `first_review` nobody did yet. Bots' reviews
        do not count.

    WaitingCounts:
      type: object
      description: Open PRs by what they wait on.
      additionalProperties: false
      required: [draft, first_review, review, changes, merge]
      properties:
        draft: { type: integer }
        first_review: { type: integer }
        review: { type: integer }
        changes: { type: integer }
        merge: { type: integer }

    OpenRepo:
      type: object
      additionalProperties: false
      required: [repo, open, long, jammed, age, waiting, long_waiting, inactive]
      properties:
        repo: { type: string }
        open: { type: integer, description: Open and not inactive. }
        long: { type: integer, description: Open `long_days` or longer. }
        jammed: { type: boolean, description: "`long` reaches `jam_min`." }
        age: { $ref: "#/components/schemas/Spread", description: Over `open`; the median, never the oldest. }
        waiting: { $ref: "#/components/schemas/WaitingCounts" }
        long_waiting: { $ref: "#/components/schemas/WaitingCounts", description: What the `long` ones wait on. }
        inactive: { type: integer, description: Open with no event for `inactive_days`; in no other count. }

    OpenPRs:
      type: object
      description: |
        The PRs open at the period's end, whenever opened (every other PR
        number counts a PR once merged), GitOps promotions and bots left
        out. Read from the events before `at` only: the
        previous period's end reads what was open then, plus the PRs open
        all along that riptide heard of only later. Age from the PR's
        creation date as Bitbucket sends it. A PR with no event for
        `inactive_days` counts in `inactive` only: riptide cannot tell a PR
        nobody touches from one whose close event was lost.
      additionalProperties: false
      required: [at, long_days, jam_min, inactive_days, open, long, jammed, jammed_long, inactive, age, waiting,
                 long_waiting, jammed_waiting, repos]
      properties:
        at: { $ref: "#/components/schemas/Instant" }
        long_days: { type: integer, description: "Open this many days or more is long open (7)." }
        jam_min: { type: integer, description: "A repo with this many long-open PRs or more is jammed (4)." }
        inactive_days: { type: integer, description: "No event this many days or more is inactive (30)." }
        open: { type: integer }
        long: { type: integer }
        jammed: { type: integer, description: Jammed repos. }
        jammed_long: { type: integer, description: The jammed repos' long-open PRs. }
        inactive: { type: integer }
        age: { $ref: "#/components/schemas/Spread" }
        waiting: { $ref: "#/components/schemas/WaitingCounts" }
        long_waiting: { $ref: "#/components/schemas/WaitingCounts" }
        jammed_waiting:
          $ref: "#/components/schemas/WaitingCounts"
          description: What the jammed repos' long-open PRs wait on.
        repos:
          type: array
          description: |
            The repos with an open PR, inactive ones aside: jammed repos
            first, then by long-open PRs, then by the median age. The top 8,
            and every repo with a long-open PR past them.
          items: { $ref: "#/components/schemas/OpenRepo" }

    Share:
      type: object
      additionalProperties: false
      required: [count, n, rate]
      properties:
        count: { type: integer }
        n: { type: integer }
        rate: { $ref: "#/components/schemas/NullableNumber" }

    Period:
      type: object
      additionalProperties: false
      required: [from, to, weeks]
      properties:
        from: { $ref: "#/components/schemas/Instant" }
        to: { $ref: "#/components/schemas/Instant" }
        weeks:
          type: array
          description: The calendar weeks, oldest first; every weekly series has one value per week.
          items:
            type: object
            additionalProperties: false
            required: [start, end, kw]
            properties:
              start: { $ref: "#/components/schemas/Instant" }
              end: { $ref: "#/components/schemas/Instant" }
              kw: { type: integer, minimum: 1, maximum: 53, description: ISO 8601 week number. }

    Delivery:
      type: object
      additionalProperties: false
      required: [production_stage, pre_environment, frequency, lead_time, lead_time_pre]
      properties:
        production_stage: { type: string }
        pre_environment:
          type: [string, "null"]
          description: The stage before production the lead-time breakdown names, else the product's most deployed one.
        frequency: { $ref: "#/components/schemas/DeployFrequency" }
        lead_time: { $ref: "#/components/schemas/LeadTimes" }
        lead_time_pre:
          oneOf:
            - { $ref: "#/components/schemas/LeadTimes" }
            - { type: "null" }

    DeployFrequency:
      type: object
      description: Successful production syncs in the period, counted once per GitOps revision.
      additionalProperties: false
      required: [releases, syncs, first_seen, resyncs, per_week, low_sample, since, weeks, succeeded, failed,
                 finished, success_rate, argo_reporting, median_week, days, no_data_days, weekdays]
      properties:
        releases: { type: integer, description: Revisions that brought new images. }
        syncs: { type: integer, description: All revisions. }
        first_seen: { type: integer, description: "Revisions that were some App's first deploy, no release." }
        resyncs: { type: integer, description: Revisions without new images. }
        per_week:
          type: number
          description: Releases per week over the period, or since `since`.
        low_sample:
          type: boolean
          description: "`per_week` rests on less than a week of Argo CD data."
        since:
          $ref: "#/components/schemas/NullableInstant"
          description: When Argo CD's data starts inside the period; null when it covers it.
        weeks:
          type: array
          description: Each revision in the week of its first deploy.
          items:
            type: object
            additionalProperties: false
            required: [release, sync, first_seen]
            properties:
              release: { type: integer }
              sync: { type: integer }
              first_seen: { type: integer }
        succeeded: { type: integer, description: "Successful syncs, not revisions." }
        failed: { type: integer }
        finished: { type: integer }
        success_rate: { $ref: "#/components/schemas/NullableNumber" }
        argo_reporting:
          type: boolean
          description: Argo CD reported for the team before the period's end.
        median_week:
          $ref: "#/components/schemas/NullableNumber"
          description: |
            Median of the releases per week over the whole weeks Argo CD
            reported all of, the running week left out.
        days:
          type: array
          description: |
            Releases per calendar day in the viewer's zone, each in the day of
            its first deploy: the period's weeks Monday first, 7 per week,
            the running week's days after now included.
          items:
            type: object
            additionalProperties: false
            required: [date, releases, step, no_data]
            properties:
              date: { type: string, format: date, description: The local calendar date. }
              releases: { type: integer, minimum: 0 }
              step:
                type: integer
                enum: [0, 1, 2, 3, 4]
                description: The day's shade, 0 none, 4 four releases or more.
              no_data:
                type: boolean
                description: After the period's end or before Argo CD reported.
        no_data_days: { type: integer, minimum: 0, description: The days with `no_data`. }
        weekdays:
          type: array
          description: |
            Releases per weekday over the whole days with data, Monday first:
            today and Argo CD's first day are not whole.
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [releases, days, per_day]
            properties:
              releases: { type: integer, minimum: 0 }
              days: { type: integer, minimum: 0, description: The weekday's whole days with data. }
              per_day:
                $ref: "#/components/schemas/NullableNumber"
                description: Releases per day with data; null without one.

    LeadTimes:
      type: object
      description: Per commit to its first deploy on the environment; merges and service accounts out, bots apart.
      additionalProperties: false
      required: [environment, human, bot, low_sample]
      properties:
        environment: { type: string }
        human: { $ref: "#/components/schemas/Spread" }
        bot: { $ref: "#/components/schemas/Spread" }
        low_sample: { type: boolean, description: "Fewer than 10 human commits, but some." }

    LeadChain:
      type: object
      description: The lead-time breakdown per human PR merged in the period.
      additionalProperties: false
      required: [stages, pre_environment, attention_share, min_prs, before_prod, reaches_prod, bucket_bounds_s]
      properties:
        stages:
          type: array
          description: In order; `to_pre` only when there is a stage before production.
          items:
            type: object
            additionalProperties: false
            required: [key, n, p50, p90, low_sample, share, hot, histogram, durations_s]
            properties:
              key: { type: string, enum: [coding, review, merge, to_pre, to_prod] }
              n: { type: integer }
              p50: { $ref: "#/components/schemas/NullableNumber" }
              p90: { $ref: "#/components/schemas/NullableNumber" }
              low_sample: { type: boolean, description: Fewer than 10 PRs. }
              share:
                $ref: "#/components/schemas/NullableNumber"
                description: The stage's part of the summed medians, 0..1; equal parts when all medians are 0. Null without data or when `reaches_prod` is false.
              hot: { type: boolean, description: The stage with the largest median; none when `reaches_prod` is false. }
              histogram:
                type: [array, "null"]
                description: |
                  The stage's PRs per `bucket_bounds_s` bucket, one count fewer
                  than bounds; a wait under the first bound counts in the first
                  bucket, one at or past the last bound in the last. Null when
                  `low_sample`: `durations_s` instead.
                items: { type: integer, minimum: 0 }
              durations_s:
                type: [array, "null"]
                description: The stage's waits in seconds, ascending, only when `low_sample`; null otherwise.
                items: { type: number }
        bucket_bounds_s:
          type: array
          description: |
            Every stage histogram's bucket edges in seconds, ascending, log-spaced
            from 5 min to 28 days; bucket i is [bound i, bound i+1).
          items: { type: number }
        pre_environment: { type: [string, "null"] }
        attention_share:
          type: number
          description: The hot stage's share from which it is a finding to attend to, not a hint.
        min_prs:
          type: integer
          description: The PRs the hot stage needs for that, as for `low_sample`.
        before_prod:
          type: number
          description: Sum of the medians before the last stage.
        reaches_prod:
          type: boolean
          description: |
            Some PR has a production wait. False: no shares and no hot stage,
            the medians would add up to the time to merge only.

    Review:
      type: object
      additionalProperties: false
      required: [cycle, review, approved, approved_on_first_touch, first_touch_rate, merged, untracked,
                 untracked_rate, cycle_histogram, within_day, change_mix, mix_total, mix_share]
      properties:
        cycle:
          $ref: "#/components/schemas/Spread"
          description: Opened to merged, human PRs merged in the period, GitOps repos out.
        review:
          $ref: "#/components/schemas/Spread"
          description: Ready to first human approval, the breakdown's review stage.
        approved: { type: integer }
        approved_on_first_touch: { type: integer }
        first_touch_rate: { $ref: "#/components/schemas/NullableNumber" }
        merged: { type: integer, description: "Merged PRs, people's only." }
        untracked: { type: integer, description: "Of those, without a Jira key." }
        untracked_rate: { $ref: "#/components/schemas/NullableNumber" }
        cycle_histogram:
          type: object
          description: PRs per cycle-time bucket; one count more than bounds, the last bucket open.
          additionalProperties: false
          required: [upper_bounds_s, human]
          properties:
            upper_bounds_s:
              type: array
              description: Each bucket's upper bound in seconds, exclusive, ascending.
              items: { type: number }
            human: { type: array, items: { type: integer } }
        within_day:
          $ref: "#/components/schemas/Share"
          description: Of the PRs in `cycle`, those merged under 24 h after opening (exclusive, as the histogram's bounds).
        change_mix:
          type: array
          description: Merged PRs per week by branch prefix.
          items: { $ref: "#/components/schemas/MixCounts" }
        mix_total:
          $ref: "#/components/schemas/MixCounts"
          description: "`change_mix` over the period."
        mix_share:
          type: object
          description: Each prefix's part of `mix_total`, 0..1; null without merged PRs.
          additionalProperties: false
          required: [feature, bugfix, hotfix, other]
          properties:
            feature: { $ref: "#/components/schemas/NullableNumber" }
            bugfix: { $ref: "#/components/schemas/NullableNumber" }
            hotfix: { $ref: "#/components/schemas/NullableNumber" }
            other: { $ref: "#/components/schemas/NullableNumber" }

    MixCounts:
      type: object
      additionalProperties: false
      required: [feature, bugfix, hotfix, other]
      properties:
        feature: { type: integer }
        bugfix: { type: integer }
        hotfix: { type: integer }
        other: { type: integer }

    Build:
      type: object
      additionalProperties: false
      required: [data_from, starts_inside, gap_weeks, kinds, ci_flow, hotspots, feature_hint]
      properties:
        data_from:
          $ref: "#/components/schemas/NullableInstant"
          description: When riptide first received a run of the team.
        starts_inside: { type: boolean, description: "`data_from` falls after the period's start." }
        gap_weeks: { type: integer, description: Leading weeks that ended before `data_from`. }
        kinds:
          type: array
          description: |
            Per kind of run with runs, never averaged across kinds; in the
            order feature, main, release, other, unknown.
          items: { $ref: "#/components/schemas/BuildStats" }
        ci_flow: { $ref: "#/components/schemas/CIFlow" }
        hotspots: { $ref: "#/components/schemas/Hotspots" }
        feature_hint:
          type: [object, "null"]
          additionalProperties: false
          description: |
            Not null when no run counted as a feature build while `other` runs
            did on branches that look like work in progress: not release,
            renovate, dependabot or snyk (with `/` or `-`), develop, nightly
            or a pipeline name without a branch. Feature runs without a
            verdict count as none. Their scheme is most likely one riptide
            does not recognise; `other`'s `prefixes` name it.
          required: [runs]
          properties:
            runs: { type: integer, description: "Those `other` runs, with a verdict." }

    FlowOutcome:
      type: string
      enum: [succeeded, flaky, failed, no_verdict, outlier]
      description: |
        Where a run's CI time went, each second in exactly one: `succeeded`,
        `flaky` (BuildStats' `flaky_seconds`), `failed` (FAILURE, UNSTABLE,
        Failed: the rest of BuildStats' `wasted_seconds`),
        `no_verdict` (ABORTED, NOT_BUILT, Tekton's None, a Jenkins timeout),
        each outliers aside; `outlier`, any verdict.

    CIFlow:
      type: object
      additionalProperties: false
      description: |
        Build's `kinds`' CI time from kind to outcome, outliers included,
        no second twice: per kind, succeeded + flaky + failed + no_verdict =
        `ci_seconds` and outlier = `outlier_seconds`. Hours add up across
        kinds; a share of a kind is of its own time only. A negative
        duration (clock skew) is no duration, here and everywhere else.
      required: [total_seconds, kinds, outcomes, links, repos, other_repos, other_seconds, other_failed]
      properties:
        total_seconds:
          $ref: "#/components/schemas/Seconds"
          description: Every kind's time, outliers included; 0 without a duration.
        kinds:
          type: array
          description: Kinds with time, in Build's `kinds` order; their `seconds` sum to `total_seconds`.
          items: { $ref: "#/components/schemas/FlowKind" }
        outcomes:
          type: array
          description: Outcomes with time, in FlowOutcome's order; their `seconds` sum to `total_seconds`.
          items: { $ref: "#/components/schemas/FlowOutcomeShare" }
        links:
          type: array
          description: A kind's outcomes with time, by kind as `kinds`, then by outcome.
          items: { $ref: "#/components/schemas/FlowLink" }
        repos:
          type: array
          description: |
            The 3 repos with the most time across kinds, outliers included,
            most first; with the folded rest their `seconds` sum to
            `total_seconds`, their `failed` to the failed outcome. No better
            direction: more CI time can be more work.
          items:
            type: object
            additionalProperties: false
            required: [repo, seconds, failed]
            properties:
              repo: { type: string }
              seconds: { $ref: "#/components/schemas/Seconds" }
              failed:
                $ref: "#/components/schemas/Seconds"
                description: Its red runs' time, the flaky and failed outcomes.
        other_repos: { type: integer, description: The repos with time past the 3 named. }
        other_seconds: { $ref: "#/components/schemas/Seconds" }
        other_failed: { $ref: "#/components/schemas/Seconds" }

    FlowKind:
      type: object
      additionalProperties: false
      required: [kind, seconds, share]
      properties:
        kind: { $ref: "#/components/schemas/RunKind" }
        seconds:
          $ref: "#/components/schemas/Seconds"
          description: "The kind's `ci_seconds` + `outlier_seconds`."
        share: { type: number, description: "Of CIFlow's `total_seconds`." }

    FlowOutcomeShare:
      type: object
      additionalProperties: false
      required: [outcome, seconds, share]
      properties:
        outcome: { $ref: "#/components/schemas/FlowOutcome" }
        seconds: { $ref: "#/components/schemas/Seconds" }
        share: { type: number, description: "Of CIFlow's `total_seconds`." }

    FlowLink:
      type: object
      additionalProperties: false
      required: [kind, outcome, seconds, share_of_kind, share]
      properties:
        kind: { $ref: "#/components/schemas/RunKind" }
        outcome: { $ref: "#/components/schemas/FlowOutcome" }
        seconds: { $ref: "#/components/schemas/Seconds" }
        share_of_kind: { type: number, description: "Of the kind's FlowKind `seconds`." }
        share: { type: number, description: "Of CIFlow's `total_seconds`." }

    BuildStats:
      type: object
      additionalProperties: false
      description: |
        One kind of run. A run without a verdict (see RunVerdict) is neither
        a failure nor a run, as in the hotspots: it counts in `no_verdict`
        and `ci_seconds` only, so `runs` = `succeeded` + `failed`. An
        outlier (see Hotspots) keeps its verdict but none of its time: it
        counts in `outlier_runs` and `outlier_seconds` instead. The time
        split by outcome is Build's `ci_flow`.
      required: [kind, runs, succeeded, failed, no_verdict, success_rate, duration, waiting, building, ci_seconds,
                 wasted_seconds, flaky_runs, flaky_rate, flaky_of_failed, flaky_seconds, unjudged,
                 outlier_runs, outlier_seconds, weekly, prefixes]
      properties:
        kind: { $ref: "#/components/schemas/RunKind" }
        runs: { type: integer, description: Runs with a verdict. }
        succeeded: { type: integer }
        failed: { type: integer }
        no_verdict: { type: integer, description: "ABORTED, NOT_BUILT, Tekton's None, ..." }
        success_rate: { $ref: "#/components/schemas/NullableNumber" }
        duration:
          $ref: "#/components/schemas/Spread"
          description: Over `runs`, those without a verdict and outliers left out.
        waiting:
          $ref: "#/components/schemas/Spread"
          description: |
            The wait for a build agent, from `started_at` to `agent_started_at`,
            over the runs of `duration` whose CI reports `agent_started_at`
            (one outside the run is left out). Its `n` may be well below
            `duration`'s; a run without one has no wait, never a wait of 0.
        building:
          $ref: "#/components/schemas/Spread"
          description: The rest of the same runs, from `agent_started_at` to `finished_at`.
        ci_seconds:
          $ref: "#/components/schemas/Seconds"
          description: Every run's time, those without a verdict included, outliers left out.
        wasted_seconds:
          $ref: "#/components/schemas/Seconds"
          description: Time of the failed runs, outliers left out.
        flaky_runs:
          type: integer
          description: |
            Failed runs a later run of the same pipeline passed on the same
            commit, under another run ID; runs without a verdict between
            them do not count. Outliers included, as in `failed`. A lower
            bound: retries inside a run, a commit built once and a rerun
            after the period go unseen.
        flaky_rate:
          $ref: "#/components/schemas/NullableNumber"
          description: "`flaky_runs` over the runs with a verdict and a commit."
        flaky_of_failed:
          $ref: "#/components/schemas/NullableNumber"
          description: "`flaky_runs` over `failed`."
        flaky_seconds:
          $ref: "#/components/schemas/Seconds"
          description: The flaky runs' part of `wasted_seconds`.
        unjudged: { type: integer, description: "Runs with a verdict but no commit: never flaky, out of `flaky_rate`." }
        outlier_runs: { type: integer, description: "Runs past the kind's outlier threshold, with or without a verdict." }
        outlier_seconds:
          $ref: "#/components/schemas/Seconds"
          description: The outliers' time.
        weekly:
          type: array
          description: Success rate per week; null for a week without runs.
          items: { $ref: "#/components/schemas/NullableNumber" }
        prefixes:
          type: array
          description: |
            Kind `other` only, empty for every other kind: its five most
            frequent branch schemes over `runs`, most runs first.
            Computed for the shown period only, never the previous one.
          items: { $ref: "#/components/schemas/BranchPrefix" }

    BranchPrefix:
      type: object
      additionalProperties: false
      required: [prefix, runs]
      properties:
        prefix:
          type: string
          description: |
            The branch lowercased, up to the first `/` (`release/`), else up
            to the first `-` (`kas-…`, a Jira key's project or a person's
            name), else whole (`nightly`); empty for a pipeline name without
            a branch.
        runs: { type: integer }

    Hotspots:
      type: object
      description: |
        Repos against their own runs of the same kind in the previous
        period, never the team's (a kind mixes toolchains), and runs far
        past the kind's median. A run without a verdict (see RunVerdict)
        counts as neither failure nor run. An outlier counts as a run and in
        failure rates, but in no duration or wasted time.
      additionalProperties: false
      required: [min_runs, slow_factor, failing_more_factor, failing_more_min_points, failing_more_min_failures,
                 outlier_factor,
                 outlier_min_s, outlier_repo_min_runs, slowest_min_runs, kinds, outliers, outlier_count,
                 outlier_groups, heat_min_runs, heat_steps, heat_classes]
      properties:
        min_runs: { type: integer, description: "Runs a repo needs in a kind, in both periods, to be flagged." }
        slow_factor: { type: number, description: A repo median this many times its previous one is slow. }
        failing_more_factor:
          type: number
          description: |
            A failure rate this many times the repo's previous one and at
            least `failing_more_min_points` above it is failing more, at most
            halfway from the previous one to 100 %, with
            `failing_more_min_failures` failed runs or more. A trend, not
            flakiness.
        failing_more_min_points:
          type: number
          description: Points of 0..1 a flagged repo's failure rate is at least above its previous one.
        failing_more_min_failures: { type: integer, description: Failed runs a flagged repo has at least. }
        outlier_factor:
          type: number
          description: |
            A run is an outlier past this many times its kind's team median
            and past `outlier_min_s`, and, when its repo has
            `outlier_repo_min_runs` runs with a verdict and a duration of the
            kind, past this many times the repo's median too. Medians are over
            runs with a verdict and a duration, outliers included.
        outlier_min_s:
          $ref: "#/components/schemas/Seconds"
          description: No run shorter than this is an outlier.
        outlier_repo_min_runs: { type: integer, description: Runs a repo needs for a median of its own in the outlier cut. }
        slowest_min_runs:
          type: integer
          description: Runs with a verdict and a duration, outliers aside, a repo needs to rank in `slowest`.
        heat_min_runs:
          type: integer
          description: Runs with a verdict a heatmap cell needs for a `step`.
        heat_steps:
          type: array
          description: |
            Failure rates, 0..1, where heatmap `step` 2, 3 and 4 start; step 1
            is any failure below the first.
          items: { type: number }
        heat_classes:
          type: array
          description: |
            The heatmap's classes for its legend, step 0 first: a failure rate
            from `from` (inclusive) to `to` (exclusive), null where open.
            Step 0 is no failure, step 1 any failure under the first cut.
          items:
            type: object
            additionalProperties: false
            required: [step, from, to]
            properties:
              step: { type: integer }
              from: { $ref: "#/components/schemas/NullableNumber" }
              to: { $ref: "#/components/schemas/NullableNumber" }
        kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, duration, failure_rate, repos, slowest, outlier_threshold_s, unplotted, heatmap]
            properties:
              kind: { $ref: "#/components/schemas/RunKind" }
              duration:
                $ref: "#/components/schemas/Spread"
                description: The team's, all repos of the kind, outliers left out.
              failure_rate: { $ref: "#/components/schemas/NullableNumber" }
              repos:
                type: array
                description: |
                  A row per repo with a counted run: those failing more by wasted
                  CI time, then the slow ones by factor, then the rest by
                  wasted time and median; the top 8 and every flagged one.
                items: { $ref: "#/components/schemas/RepoHotspot" }
              slowest:
                type: array
                description: |
                  The 5 repos of the kind with the longest median `duration`,
                  longest first, ties by name; only those with
                  `slowest_min_runs` runs with a verdict and a duration,
                  outliers aside, or more. Flagged or not, no threshold: a repo steady at 25
                  minutes is never slow against itself.
                items: { $ref: "#/components/schemas/RepoHotspot" }
              outlier_threshold_s:
                $ref: "#/components/schemas/NullableSeconds"
                description: |
                  `outlier_factor` times the team's median, at least
                  `outlier_min_s`; null without a run with a verdict and a
                  duration. Higher for a slower repo.
              unplotted:
                type: integer
                description: |
                  The kind's repos without a median and a failure rate in
                  `repos`: past its cut, without a run with a verdict, or
                  every timed run an outlier.
              heatmap:
                type: array
                description: |
                  A row per repo of `repos`, in its order, then one `other`
                  row for the kind's repos past that cut (only when there
                  are any); a cell per week of the period: the failure rate
                  per week, runs counted as in `repos` (with a verdict,
                  outliers included). Weeks as BuildStats' `weekly`: by a
                  run's end, else its start, so a column holds the runs the
                  kind's weekly rate is over. A run loaded for the period
                  (by when its event arrived) that ended outside it counts
                  in no week, so a row may sum to less than its repo's
                  `runs`.
                items:
                  type: object
                  additionalProperties: false
                  required: [repo, other, weeks]
                  properties:
                    repo: { type: string, description: Empty on the `other` row. }
                    other: { type: boolean, description: "The kind's repos past the cut of `repos`, together." }
                    weeks:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [runs, failed, rate, step, no_data]
                        properties:
                          no_data:
                            type: boolean
                            description: |
                              No run, in a week before the run data starts
                              (Build's `gap_weeks`): unknown, not none.
                          runs: { type: integer, description: Runs with a verdict. }
                          failed: { type: integer }
                          rate:
                            $ref: "#/components/schemas/NullableNumber"
                            description: "`failed` over `runs`; null without a run."
                          step:
                            type: [integer, "null"]
                            minimum: 0
                            maximum: 4
                            description: |
                              Null under `heat_min_runs` runs (no verdict), 0
                              without a failure, else 1..4 by `heat_steps`.
        outliers:
          type: array
          description: Runs past their kind's threshold across kinds, longest first, the top 10.
          items:
            type: object
            additionalProperties: false
            required: [kind, pipeline_name, repo, run_id, started_at, duration_s, status, factor, wait_s]
            properties:
              kind: { $ref: "#/components/schemas/RunKind" }
              pipeline_name: { type: string }
              repo: { type: string }
              run_id: { type: string }
              started_at: { $ref: "#/components/schemas/NullableInstant" }
              duration_s: { $ref: "#/components/schemas/Seconds" }
              status: { type: [string, "null"] }
              factor:
                $ref: "#/components/schemas/NullableNumber"
                description: The run's duration over its kind's team median; null when that is 0.
              wait_s:
                $ref: "#/components/schemas/NullableSeconds"
                description: |
                  The part of `duration_s` spent waiting for a build agent; null
                  when the CI did not report `agent_started_at`.
        outlier_count:
          type: integer
          description: Every outlier of the period, before the cut to the top 10.
        outlier_groups:
          type: array
          description: |
            Outliers of all kinds, before the cut to the top 10, chained by
            start: one started within 30 min of a group's last joins it. Two
            runs or more, the largest first. Shared: two repos or more, so the
            build agents, not a repo.
          items:
            type: object
            additionalProperties: false
            required: [from, to, runs, repos, shared]
            properties:
              from: { $ref: "#/components/schemas/Instant" }
              to: { $ref: "#/components/schemas/Instant" }
              runs: { type: integer }
              repos: { type: array, items: { type: string } }
              shared: { type: boolean }

    RepoHotspot:
      type: object
      description: One repo of a kind against its own runs of the kind in the previous period.
      additionalProperties: false
      required: [repo, runs, duration, waiting, building, duration_change, factor, slow, failures, failure_rate,
                 failure_change, wasted_seconds, failing_more, flaky_runs, flaky_seconds, ci_seconds, compared,
                 prev_complete,
                 plotted]
      properties:
        repo: { type: string }
        runs: { type: integer, description: Runs with a verdict. }
        duration:
          $ref: "#/components/schemas/Spread"
          description: Over the runs with a verdict and a duration, outliers left out.
        waiting:
          $ref: "#/components/schemas/Spread"
          description: |
            The wait for a build agent over the runs of `duration` whose CI
            reports `agent_started_at`, as BuildStats' `waiting`; `n` 0 and
            nulls when none does.
        building:
          $ref: "#/components/schemas/Spread"
          description: The rest of the same runs, from `agent_started_at` to `finished_at`.
        duration_change:
          $ref: "#/components/schemas/Change"
          description: |
            The median against the repo's previous one, both over
            `min_runs` runs with a verdict and a duration or more.
            `no_value`: no runs of the kind under this repo's name
            then, or no median (every run an outlier).
        factor:
          $ref: "#/components/schemas/NullableNumber"
          description: The median over the previous one; null without a comparison or at a previous 0.
        slow: { type: boolean, description: "`factor` at least `slow_factor`." }
        failures: { type: integer }
        failure_rate: { $ref: "#/components/schemas/NullableNumber" }
        failure_change:
          $ref: "#/components/schemas/Change"
          description: The failure rate against the repo's previous one, both over `min_runs` runs or more.
        wasted_seconds: { $ref: "#/components/schemas/Seconds" }
        failing_more: { type: boolean, description: "The failure rate against the previous one, see `failing_more_factor`." }
        flaky_runs: { type: integer, description: "Its failed runs a rerun passed on the same commit, as BuildStats'. Never a flag." }
        flaky_seconds:
          $ref: "#/components/schemas/Seconds"
          description: Their part of `wasted_seconds`.
        ci_seconds:
          $ref: "#/components/schemas/Seconds"
          description: |
            Every run's time of the kind, those without a verdict included,
            outliers left out. The rows add up to at most the kind's
            `ci_seconds`: a repo without a run with a verdict has no row,
            and `repos` is cut.
        compared: { type: boolean, description: "`duration_change` or `failure_change` has a `prev`." }
        prev_complete: { type: boolean, description: "Both have a `prev`: a previous median and failure rate." }
        plotted: { type: boolean, description: "A median and a failure rate: a position to draw the repo at." }

    Costs:
      type: object
      description: noergler spend, final rollups closed in the period, in USD.
      additionalProperties: false
      required: [total, merged, merged_reviews, per_kloc, wasted, wasted_share, promotion, promotion_reviews,
                 rows, reviewed_repos]
      properties:
        total: { type: number, description: "Every outcome, stage promotions included." }
        merged: { type: number, description: "Merged PRs, GitOps repos out." }
        merged_reviews: { type: integer, description: "Merged PRs, GitOps repos out." }
        per_kloc:
          $ref: "#/components/schemas/NullableNumber"
          description: Per 1000 changed lines of merged PRs, GitOps repos out.
        wasted: { type: number, description: "Spent on PRs declined or deleted, GitOps repos out." }
        wasted_share:
          $ref: "#/components/schemas/NullableNumber"
          description: "`wasted` over `total` less `promotion`, 0..1; null when that is 0."
        promotion: { type: number, description: "Spent on stage-promotion PRs (GitOps repos), every outcome." }
        promotion_reviews: { type: integer, description: "Stage-promotion PRs reviewed." }
        rows:
          type: array
          description: By product (all products) or by repo (one product), largest first.
          items:
            type: object
            additionalProperties: false
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }
        reviewed_repos: { type: integer }

    Facts:
      type: object
      additionalProperties: false
      required: [production_stage, limit, prs, deploys, runs]
      properties:
        production_stage: { type: string }
        limit: { type: integer, description: Rows per table at most. }
        prs:
          type: object
          additionalProperties: false
          required: [count, rows]
          properties:
            count: { type: integer }
            rows: { type: array, items: { $ref: "#/components/schemas/PRFact" } }
        deploys:
          type: object
          additionalProperties: false
          required: [count, rows]
          properties:
            count: { type: integer }
            rows: { type: array, items: { $ref: "#/components/schemas/DeployFact" } }
        runs:
          type: object
          additionalProperties: false
          required: [count, rows]
          properties:
            count: { type: integer }
            rows: { type: array, items: { $ref: "#/components/schemas/RunFact" } }

    JiraRef:
      type: object
      additionalProperties: false
      required: [key, url]
      properties:
        key: { type: string, example: KAS-7 }
        url:
          type: [string, "null"]
          description: The ticket, `<jira.base_url>/browse/<key>`; null when the config sets no `jira.base_url`.

    TitlePart:
      type: object
      additionalProperties: false
      required: [text, jira]
      properties:
        text: { type: string }
        jira:
          description: Set when the text is a Jira key.
          oneOf:
            - { $ref: "#/components/schemas/JiraRef" }
            - { type: "null" }

    PRFact:
      type: object
      description: |
        A PR open at the period's end, whenever opened, oldest first, the
        inactive ones after them; then a PR opened or merged in the period,
        newest merge or opening first.
      additionalProperties: false
      required: [repo, pr_id, title, title_parts, jira_prefix, jira_more, gitops, change_type, state, review_s,
                 cycle_s, merged_at, prod_at, to_prod_s, age_s, waiting, idle_s]
      properties:
        repo: { type: string }
        pr_id: { type: integer }
        title: { type: [string, "null"] }
        title_parts:
          type: array
          description: The title split at its Jira keys; empty without a title.
          items: { $ref: "#/components/schemas/TitlePart" }
        jira_prefix:
          type: array
          description: The Jira keys the title does not show, three at most.
          items: { $ref: "#/components/schemas/JiraRef" }
        jira_more: { type: integer, minimum: 0, description: "Keys the title does not show beyond jira_prefix." }
        gitops: { type: boolean, description: A GitOps repo's promotion PR. }
        change_type: { type: [string, "null"] }
        state: { type: string, enum: [open, merged, declined, deleted] }
        review_s: { $ref: "#/components/schemas/NullableSeconds" }
        cycle_s: { $ref: "#/components/schemas/NullableSeconds" }
        merged_at: { $ref: "#/components/schemas/NullableInstant" }
        prod_at:
          $ref: "#/components/schemas/NullableInstant"
          description: The merge commit's first production deploy.
        to_prod_s: { $ref: "#/components/schemas/NullableSeconds" }
        age_s:
          $ref: "#/components/schemas/NullableSeconds"
          description: A PR open at the period's end, its age then; null for every other PR.
        waiting:
          oneOf:
            - { $ref: "#/components/schemas/PRWaiting" }
            - { type: "null" }
          description: A PR open at the period's end, what it waits on; null for every other PR.
        idle_s:
          $ref: "#/components/schemas/NullableSeconds"
          description: A PR open at the period's end, the time since its last event; null for every other PR.

    DeployFact:
      type: object
      description: A finished Argo CD sync in the period, newest first.
      additionalProperties: false
      required: [at, app, environment, revision, new_images, class, phase]
      properties:
        at: { $ref: "#/components/schemas/Instant" }
        app: { type: string }
        environment: { type: [string, "null"] }
        revision: { type: string }
        new_images: { type: array, items: { type: string } }
        class:
          type: string
          enum: [failed, release, first_seen, sync]
          description: What it counts as; `failed` for any phase but Succeeded.
        phase: { type: string, description: "Argo CD's operation phase: Succeeded, Failed, ..." }

    RunFact:
      type: object
      description: A finished CI run in the period, newest first.
      additionalProperties: false
      required: [pipeline_name, run_id, kind, commit_sha, shown_sha, duration_s, image_refs, status, verdict, outcome,
                 gitops, flaky]
      properties:
        pipeline_name: { type: string }
        run_id: { type: string }
        kind: { $ref: "#/components/schemas/RunKind" }
        commit_sha: { type: [string, "null"], description: Null for a run that failed before its checkout. }
        shown_sha:
          type: [string, "null"]
          description: The commit to show, the code built - a PR build's own head where `commit_sha` is a merge the CI made of it, else `commit_sha`.
        duration_s: { type: [integer, "null"] }
        image_refs: { type: array, items: { type: string } }
        status: { type: [string, "null"], description: As the CI sent it. }
        verdict: { $ref: "#/components/schemas/RunVerdict" }
        outcome:
          type: [string, "null"]
          enum: [succeeded, failed, null]
          description: |
            The status in the UI's words when it plainly says succeeded
            (SUCCESS, Succeeded, Completed) or failed (FAILURE, Failed);
            null for any other word (UNSTABLE, ABORTED, …), which the UI
            shows as the CI sent it.
        gitops: { type: boolean, description: "A run in a GitOps repo, a stage promotion's check: listed, counted in no build number." }
        flaky:
          type: boolean
          description: |
            Failed, and a later run of the pipeline passed on the same
            commit: one of BuildStats' `flaky_runs`. The search finds it by
            the word Flaky.

    RunVerdict:
      type: string
      enum: [success, failure, none]
      description: |
        What a run's status says about the build: `success` for SUCCESS
        (Jenkins), Succeeded or Completed (Tekton); `failure` for FAILURE,
        UNSTABLE (Jenkins) or Failed (Tekton); `none` for anything else
        (ABORTED, NOT_BUILT, Tekton's None), a run that ended without saying.

    Meta:
      type: object
      additionalProperties: false
      required: [team, from, to, generated_at, production_stage, data_start, data_end, build_data_from,
                 build_type_from]
      properties:
        team: { type: string }
        from: { $ref: "#/components/schemas/Instant" }
        to: { $ref: "#/components/schemas/Instant" }
        generated_at: { $ref: "#/components/schemas/Instant" }
        production_stage:
          type: string
          description: The config's production environment; the other `environment` values are earlier stages.
        data_start:
          $ref: "#/components/schemas/SourceTimes"
          description: The team's first event per source over all history.
        data_end:
          $ref: "#/components/schemas/SourceTimes"
          description: The team's latest event per source over all history, how fresh it is.
        build_data_from:
          $ref: "#/components/schemas/NullableInstant"
          description: When riptide first received a pipeline event for the team.
        build_type_from:
          $ref: "#/components/schemas/NullableInstant"
          description: |
            When riptide first received a pipeline event of the team carrying
            a build_type; null if none ever did. Before it, a run's null
            build_type means not collected yet; after it, the sender said
            nothing.

    SourceTimes:
      type: object
      description: One instant per source; null when the source never reported for the team.
      additionalProperties: false
      required: [bitbucket, pipeline, argocd, noergler]
      properties:
        bitbucket: { $ref: "#/components/schemas/NullableInstant" }
        pipeline: { $ref: "#/components/schemas/NullableInstant" }
        argocd: { $ref: "#/components/schemas/NullableInstant" }
        noergler: { $ref: "#/components/schemas/NullableInstant" }

    Product:
      type: object
      additionalProperties: false
      required: [key, repos, apps]
      properties:
        key: { type: string, description: "The Bitbucket project key, lowercased." }
        repos: { type: array, items: { type: string } }
        apps: { type: array, items: { type: string } }

    AnalysisStatus:
      type: object
      description: |
        A view's assessment over its closed weeks and, where there is one,
        the analysis that words it. `state`: `fresh` an analysis of the last
        closed week, `older` an older one within its window's schedule,
        `none` none to show, `off` no model configured.
      additionalProperties: false
      required: [state, enabled, running, assessment, layout, analysis, failure, next_run, cooldown_until, zone]
      properties:
        state: { type: string, enum: [fresh, older, none, off] }
        layout:
          type: object
          description: |
            What the page shows where, decided by the backend: the focus
            repos and the cards in order (what the analysis words, or the
            first 3 candidates and 4 team-wide signals; either way the best
            2 good and 1 done signal on top, worded or not), the signals
            spotted without words, and the tally. Gates and the question
            are in none.
          additionalProperties: false
          required: [focus, cards, also, tally]
          properties:
            focus:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [repo, lever, tab]
                properties:
                  repo: { type: string }
                  lever: { type: string, description: "The model's lever key where it worded the repo, the rules' otherwise." }
                  tab: { type: string, enum: [prs, runs], description: The facts table the repo links to. }
            cards: { type: array, items: { $ref: "#/components/schemas/LayoutCard" } }
            also:
              type: array
              description: The signals spotted without words, as chips.
              items: { $ref: "#/components/schemas/LayoutCard" }
            tally:
              type: object
              description: |
                The signals by column, gates aside, worded or not. Good or
                done above 0 lets the page say "runs"; without either it
                says "unremarkable".
              additionalProperties: false
              required: [good, done, bad, baseline]
              properties:
                good: { type: integer, minimum: 0 }
                done: { type: integer, minimum: 0 }
                bad: { type: integer, minimum: 0 }
                baseline: { type: boolean, description: A team number has a previous period to read better against. }
        enabled: { type: boolean, description: A model is configured; the page offers to ask. }
        running: { type: boolean, description: An attempt is under way. }
        assessment: { $ref: "#/components/schemas/Assessment" }
        analysis:
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        failure:
          description: The latest attempt, failed after what is shown; null otherwise.
          oneOf:
            - type: object
              additionalProperties: false
              required: [at, detail]
              properties:
                at: { $ref: "#/components/schemas/Instant" }
                detail: { type: string }
            - type: "null"
        next_run:
          $ref: "#/components/schemas/NullableInstant"
          description: When the schedule words the view next; null without a model, and for a product the schedule leaves out.
        cooldown_until:
          $ref: "#/components/schemas/NullableInstant"
          description: When the view takes a manual run again; null when it does now.
        zone: { type: string, description: "The IANA zone the closed weeks are cut in, the page shows their days there; empty for Local, then the viewer's." }

    LayoutCard:
      type: object
      description: A team-wide signal as shown, its column and lever chosen by the backend.
      additionalProperties: false
      required: [signal, column, lever]
      properties:
        signal: { type: string, description: A signal id. }
        column: { type: string, enum: [good, bad, done] }
        lever: { type: string, description: "The model's lever key where it worded the card, the rules' otherwise." }

    Analysis:
      type: object
      description: The analysis shown, in both languages.
      additionalProperties: false
      required: [id, created_at, finished_at, trigger, model, cost_usd, weeks_old, text, report]
      properties:
        id: { type: integer }
        created_at: { $ref: "#/components/schemas/Instant" }
        finished_at: { $ref: "#/components/schemas/Instant" }
        trigger: { type: string, enum: [scheduled, manual] }
        model: { type: string, description: The llmwire profile id asked. }
        cost_usd:
          type: [string, "null"]
          description: Three decimals; the gateway's figure, or the list price for a vendor called directly. Null when unpriced.
        weeks_old: { type: integer, minimum: 0, description: How many closed weeks older than the last one. }
        text:
          type: object
          additionalProperties: false
          required: [de, en]
          properties:
            de: { $ref: "#/components/schemas/AnalysisText" }
            en: { $ref: "#/components/schemas/AnalysisText" }
        report:
          type: object
          additionalProperties: false
          required: [dropped, missed]
          properties:
            dropped: { type: array, items: { type: string }, description: "What the validator left out, and why." }
            missed: { type: array, items: { type: string }, description: Mandatory signal ids the text does not cover. }

    AnalysisText:
      type: object
      description: |
        The analysis in one language. Numbers appear only as `{{fact id}}`
        placeholders; a lever is a key the page words.
      additionalProperties: false
      required: [headline, trend, focus, cards, question]
      properties:
        headline: { type: string }
        trend: { type: string }
        focus:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [repo, take, retro, lever]
            properties:
              repo: { type: string }
              take: { type: string }
              retro: { type: [string, "null"] }
              lever: { type: string }
        cards:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [signal, take, retro, lever]
            properties:
              signal: { type: string, description: A signal id of the assessment. }
              take: { type: string }
              retro: { type: [string, "null"] }
              lever: { type: string }
        question: { type: string }

    Assessment:
      type: object
      description: |
        The overview's assessment over closed weeks: signals ranked (gates
        first), the focus candidates by weight, the team numbers. Every
        number and verdict computed by riptide.
      additionalProperties: false
      required: [period, previous, gaps, signals, focus, active, calm, team, question, compared]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        previous: { $ref: "#/components/schemas/Period" }
        gaps:
          type: array
          description: Sources silent for 7 days or more at the period's end; their signals are left out.
          items: { type: string, enum: [bitbucket, pipeline, argocd, noergler] }
        signals: { type: array, items: { $ref: "#/components/schemas/Signal" } }
        focus:
          type: array
          description: The repos with the most movement, at most 5; the page shows 3.
          items:
            type: object
            additionalProperties: false
            required: [repo, weight, seen, signals, facts, waiting]
            properties:
              repo: { type: string }
              weight: { type: integer }
              seen: { type: integer, description: "The most earlier assessments in a row of any of its signals." }
              signals: { type: array, items: { type: string } }
              facts: { type: array, items: { $ref: "#/components/schemas/Fact" } }
              waiting:
                oneOf:
                  - $ref: "#/components/schemas/WaitingCounts"
                  - type: "null"
        active: { type: integer, description: "Repos with a merged PR, a run or an open PR in the period." }
        calm: { type: integer, description: Those of them without a signal. }
        team: { type: array, items: { $ref: "#/components/schemas/Fact" } }
        question:
          oneOf:
            - $ref: "#/components/schemas/Signal"
            - type: "null"
        compared:
          type: boolean
          description: An assessment of the view for an earlier week was there to tell what is resolved.

    Signal:
      type: object
      description: |
        A pattern the numbers raise. `id` is stable across periods. Tones:
        `gate` silences a source, `attention` and `hint` are stuck, `good`
        runs, `talk` is a question without a verdict.
      additionalProperties: false
      required: [id, kind, tone, source, repo, run_kind, metric, stage, prev_stage, low_sample, sample, weight, seen, facts,
                 waiting, drivers]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [data_gap, pr_jam, slow_stage, slower_build, steady_slow, failing_more, change, bottleneck_moved,
                 throughput_instability, agent_wait, shared_stall, inactive_prs, resync_share, resolved, question]
        tone: { type: string, enum: [gate, attention, hint, good, talk] }
        source: { type: string, enum: [bitbucket, pipeline, argocd, noergler] }
        repo: { type: [string, "null"] }
        run_kind: { type: [string, "null"] }
        metric: { type: [string, "null"], description: "The number of a change or question, the signal id a resolved one was." }
        stage: { type: [string, "null"] }
        prev_stage: { type: [string, "null"] }
        low_sample: { type: boolean, description: "Rests on fewer than 10 cases (a stage's PRs): shown, never a headline." }
        sample: { type: [integer, "null"], description: "The cases it rests on, where counted (a stage's PRs); null otherwise." }
        weight: { type: integer }
        seen: { type: integer, description: "How many earlier assessments of the window raised it, in a row." }
        facts: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Fact" }, description: The first is the hero number. }
        waiting:
          oneOf:
            - $ref: "#/components/schemas/WaitingCounts"
            - type: "null"
        drivers:
          type: array
          description: The repos that carry a worsening, a rough split.
          items:
            type: object
            additionalProperties: false
            required: [repo, share, value, prev]
            properties:
              repo: { type: string }
              share: { type: number, minimum: 0, maximum: 1 }
              value: { $ref: "#/components/schemas/NullableNumber" }
              prev: { $ref: "#/components/schemas/NullableNumber" }
        series:
          description: |
            The hero number week by week, the previous period's and this
            one's, where the page computes it anyway: a change of deploy
            frequency (releases per week) or of a kind's build success (its
            success rate, null for a week without runs; a deploy week before
            Argo CD reported is null too). Absent for the rest, and in an
            analysis stored before the field.
          type: object
          additionalProperties: false
          required: [prev, cur]
          properties:
            prev: { type: array, items: { $ref: "#/components/schemas/NullableNumber" } }
            cur: { type: array, items: { $ref: "#/components/schemas/NullableNumber" } }

    Fact:
      type: object
      description: A number of a signal, against the previous period's where it has one.
      additionalProperties: false
      required: [id, label, unit, value, prev, verdict, magnitude]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string, enum: [seconds, share, count, per_week, weeks, usd, days] }
        value: { $ref: "#/components/schemas/NullableNumber" }
        prev: { $ref: "#/components/schemas/NullableNumber" }
        verdict: { type: string, enum: [better, worse, same, none] }
        magnitude: { type: [string, "null"], enum: [same, minor, notable, null] }
