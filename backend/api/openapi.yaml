openapi: 3.1.0

info:
  title: riptide API
  # The CONTRACT's version, not the binary's. The two move independently:
  # a release that changes no route leaves this alone.
  version: 2.0.0
  description: |
    DevOps delivery-metrics ingestion. Senders post raw events from Bitbucket
    Data Center, CI pipelines (Jenkins, Tekton, ...), Argo CD and noergler;
    riptide stores them append-only in Postgres. Metrics are computed on read.

    ## Authentication

    Every sender authenticates as its team, and the team on every stored row
    is the caller's team, never a field of the payload.

    - `/webhooks/pipeline`, `/webhooks/argocd`, `/webhooks/noergler` and
      `/auth/ping` take the team's source-specific key as a bearer token. A key
      authenticates only its own source: an `argocd` key cannot post to
      `/webhooks/pipeline`. `/auth/ping` accepts any of the team's keys.
    - `/webhooks/bitbucket/{team}` is HMAC-signed by Bitbucket with the team's
      `bitbucket` key (`X-Hub-Signature: sha256=<hex>`).

    ## Idempotency

    Every event has a delivery id, and a redelivery of the same id is
    acknowledged with `202 accepted` and not stored twice.

    ## Validation

    The pipeline, Argo CD and noergler contracts are strict: an invalid body is
    a `422`. An optional field sent as `""` is treated as absent. Bitbucket
    bodies are read permissively; a delivery riptide does not store is
    answered `202 ignored` with the reason.

servers:
  - url: /
    description: |
      This riptide instance. The webhooks and /auth/ping are on the collector
      listener (this page's); /api is on the UI listener only, so try it
      there, not here.

tags:
  - name: webhooks
    description: Event sinks.
  - name: health
    description: Sender self-checks and this document. The liveness and readiness probes (/healthz, /readyz) answer loopback callers only and are not part of this contract.
  - name: read
    description: |
      The UI's read API. Served on the UI listener only (`BACKEND_UI_ADDR`,
      loopback by default, behind the auth proxy), never on the collector's
      listener that takes the webhooks. Every number is computed here, on
      read: the UI renders and formats, it computes nothing.

paths:
  /webhooks/bitbucket/{team}:
    post:
      tags: [webhooks]
      operationId: bitbucketWebhook
      summary: Bitbucket Data Center webhook sink (HMAC-authenticated)
      description: |
        Bitbucket signs each delivery with the team's `bitbucket` key; the team
        is the path segment. The body is read permissively and stored as
        received, with the join identifiers extracted and lowercased.
      security: [{ bitbucketSignature: [] }]
      parameters:
        - name: team
          in: path
          required: true
          description: The team whose `bitbucket` key signs the delivery.
          schema: { type: string, minLength: 1 }
        - name: X-Event-Key
          in: header
          required: false
          description: Bitbucket's event key, e.g. `pr:merged`, `repo:refs_changed`.
          schema: { type: string }
        - name: X-Request-Id
          in: header
          required: false
          description: |
            Bitbucket's per-delivery id, used as the delivery id.
            `X-Request-UUID` is accepted as well. Without either, the delivery
            id is derived from the event key and the body.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The Bitbucket Data Center webhook body, stored as received.
      responses:
        "202":
          description: |
            Accepted (stored, or a redelivery of a stored event), or ignored:
            not a JSON object, the "Test connection" ping, a `pr:modified`
            that is not a draft-to-ready flip, or a push with no branch change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/pipeline:
    post:
      tags: [webhooks]
      operationId: pipelineWebhook
      summary: CI pipeline webhook sink (Jenkins, Tekton, ...)
      description: |
        Every CI lands here, told apart by `source`. Authenticated with the
        team's `jenkins` key. The delivery id is
        `source#pipeline_name#run_id#phase`.
      security: [{ teamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineEvent" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/argocd:
    post:
      tags: [webhooks]
      operationId: argocdWebhook
      summary: Argo CD notification sink
      description: |
        Authenticated with the team's `argocd` key. A deploy to a stage listed
        in the config's `environments.ignored_stages` is answered
        `202 ignored` and not stored.
      security: [{ teamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArgoCDEvent" }
      responses:
        "202":
          description: Accepted, or ignored for an ignored stage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /webhooks/noergler:
    post:
      tags: [webhooks]
      operationId: noerglerWebhook
      summary: Noergler PR-review sink (per-PR rollup and reviewer precision)
      description: |
        Authenticated with the team's `noergler` key. Unknown fields are a
        `422`. Delivery ids: `pr_completed#<pr_key>#<outcome>` and
        `feedback#<finding_id>#<verdict>`. A declined PR that is reopened and
        merged sends a second, cumulative `pr_completed`.
      security: [{ teamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/NoerglerPrCompleted"
                - $ref: "#/components/schemas/NoerglerFeedback"
              discriminator:
                propertyName: event_type
                mapping:
                  pr_completed: "#/components/schemas/NoerglerPrCompleted"
                  feedback: "#/components/schemas/NoerglerFeedback"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /auth/ping:
    get:
      tags: [health]
      operationId: authPing
      summary: Authenticated reachability check for senders
      description: |
        Senders call it at startup so a wrong key fails fast. Any of the
        team's keys authenticates; the answer names the team.
      security: [{ teamKey: [] }]
      responses:
        "200":
          description: The key is valid.
          content:
            application/json:
              schema:
                type: object
                required: [status, team]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }
                  team: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /openapi.yaml:
    get:
      tags: [health]
      operationId: openapiSpec
      summary: This document
      description: The contract as embedded in the running binary.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "304":
          description: Not modified since the ETag sent in If-None-Match.

  /docs:
    get:
      tags: [health]
      operationId: docs
      summary: Swagger UI for this document
      description: Loads Swagger UI from a CDN and points it at /openapi.yaml.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /api/teams:
    get:
      tags: [read]
      operationId: teams
      summary: The configured teams
      description: The teams in the config, sorted, for the UI's team picker. Served on the UI listener only.
      security: []
      responses:
        "200":
          description: The team names.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [teams]
                properties:
                  teams: { type: array, items: { type: string } }

  /api/metrics:
    get:
      tags: [read]
      operationId: metrics
      summary: Every number of one team's page
      description: |
        Delivery, lead-time breakdown, code review, builds with their
        hotspots, and noergler costs of the team over the period: whole
        calendar weeks in the viewer's zone, the current one running to now.
        The rules are the README's metric queries. Product = Bitbucket
        project key, the part of a repository's name before `/`; an App's
        product is that of the GitOps repo its revision is a commit of.

        No authentication of its own: the UI listener is reached through the
        auth proxy only.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReadTeam"
        - $ref: "#/components/parameters/ReadWeeks"
        - $ref: "#/components/parameters/ReadTZ"
        - $ref: "#/components/parameters/ReadProduct"
        - $ref: "#/components/parameters/ReadBots"
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "404": { $ref: "#/components/responses/ReadUnknownTeam" }
        "422": { $ref: "#/components/responses/ReadBadQuery" }
        "500": { $ref: "#/components/responses/ReadFailed" }

  /api/facts:
    get:
      tags: [read]
      operationId: facts
      summary: The single facts behind the numbers, searched
      description: |
        The team's PRs, deploys and CI runs of the period, newest first,
        filtered by product, bots (PRs only) and a case-insensitive search;
        each table the first 300 matches and how many matched.

        No authentication of its own: the UI listener is reached through the
        auth proxy only.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReadTeam"
        - $ref: "#/components/parameters/ReadWeeks"
        - $ref: "#/components/parameters/ReadTZ"
        - name: product
          in: query
          required: false
          description: |
            A product key, applied as given: one without rows matches none.
            Send the `product` /api/metrics answered; the facts read no lead
            times or reviews, so they cannot tell every product the page knows.
          schema: { type: string }
        - $ref: "#/components/parameters/ReadBots"
        - name: q
          in: query
          required: false
          description: Search text; empty matches everything.
          schema: { type: string }
      responses:
        "200":
          description: The facts tables.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facts" }
        "404": { $ref: "#/components/responses/ReadUnknownTeam" }
        "422": { $ref: "#/components/responses/ReadBadQuery" }
        "500": { $ref: "#/components/responses/ReadFailed" }

components:
  securitySchemes:
    teamKey:
      type: http
      scheme: bearer
      description: The team's key for this source, from team-keys.json.
    bitbucketSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature
      description: "`sha256=<hex>` HMAC of the body with the team's `bitbucket` key."

  responses:
    Unauthorized:
      description: Missing, malformed or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The body exceeds the limit (1 MiB; 10 MiB for Bitbucket).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: The event could not be stored. Retry; the retry dedupes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The body failed validation. Every failing field is listed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    ReadUnknownTeam:
      description: The team is not in the config.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReadBadQuery:
      description: "`team` missing, or `weeks`, `tz` or `bots` unreadable."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReadFailed:
      description: The database could not be read.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    ReadTeam:
      name: team
      in: query
      required: true
      description: A team from the config's `teams`.
      schema: { type: string, minLength: 1 }
    ReadWeeks:
      name: weeks
      in: query
      required: false
      description: The period in calendar weeks, the current one running to now. Default 4.
      schema: { type: integer, enum: [4, 12, 26] }
    ReadTZ:
      name: tz
      in: query
      required: false
      description: The viewer's IANA time zone; weeks run Monday 00:00 to Monday 00:00 there. Default UTC.
      schema: { type: string, examples: [Europe/Zurich] }
    ReadProduct:
      name: product
      in: query
      required: false
      description: A product key; one without data in the period, or none, is all products.
      schema: { type: string }
    ReadBots:
      name: bots
      in: query
      required: false
      description: "`1` counts bots' PRs in (on their own series where a chart has one)."
      schema: { type: string, enum: ["0", "1", "true", "false"] }

  schemas:
    Error:
      type: object
      required: [detail]
      additionalProperties: false
      properties:
        detail: { type: string }

    ValidationError:
      type: object
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          type: array
          items:
            type: object
            required: [type, loc, msg]
            additionalProperties: false
            properties:
              type: { type: string, description: "e.g. missing, string_too_short, extra_forbidden" }
              loc:
                type: array
                items: { type: string }
                description: '`["body"]` or `["body", "<field>"]`.'
              msg: { type: string }

    WebhookResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [accepted, ignored] }
        reason: { type: string, description: Why a Bitbucket delivery was not stored. }

    Timestamp:
      description: |
        ISO 8601; without an offset it is taken as UTC. Unix epoch seconds
        (milliseconds above 2e10) are accepted as well.
      oneOf:
        - type: string
        - type: number

    AccountKind:
      type: string
      enum: [bot, service, human]
      description: |
        What the reported account is: `bot` acts on its own (a review bot,
        Renovate), `service` is a technical account a system acts through (a
        CI user pushing merges), `human` is a person and is counted as one.

    PipelineEvent:
      type: object
      description: Unknown fields are allowed and kept in the stored payload.
      required: [source, pipeline_name, run_id, phase, commit_sha, started_at]
      properties:
        source: { type: string, minLength: 1, description: "CI system: jenkins, tekton, ..." }
        pipeline_name: { type: string, minLength: 1, description: Jenkins job / Tekton pipeline name. }
        run_id: { type: string, minLength: 1, description: Jenkins build number / Tekton PipelineRun name. }
        phase: { type: string, minLength: 1, description: STARTED / COMPLETED / FINALIZED. }
        status: { type: [string, "null"], description: SUCCESS / FAILURE / ... }
        commit_sha: { type: string, minLength: 7, description: The App-repo commit being built. }
        image_ref:
          type: [string, "null"]
          description: |
            Full image reference the run published (`registry/path:tag`). Argo
            CD reports the same strings, which makes deploy -> build -> commit an
            exact join. Omit it (or send "") for runs that publish no image. A
            run that publishes several sends `image_refs`; both may be sent and
            are merged.
        image_refs:
          type: [array, "null"]
          items: { type: string }
          description: |
            Every image the run published, for a run that pushes more than
            one (a monorepo building several apps, a multi-module service).
            Stays one event per run, so build counts and CI time are not
            multiplied. Merged with `image_ref`, trimmed and deduplicated;
            empty entries are ignored.
        actor_handle:
          type: [string, "null"]
          description: The git-host account this CI acts through.
        actor_account_kind:
          $ref: "#/components/schemas/AccountKind"
          default: service
        build_type:
          type: [string, "null"]
          description: |
            What kind of build the run was, as the pipeline reports it
            (`release`, `hotfix`, `build`, ...). Sent on COMPLETED. Free text,
            stored trimmed and lowercased; "" is absent.
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ArgoCDEvent:
      type: object
      description: Unknown fields are allowed and kept in the stored payload.
      required: [app_name, revision, images]
      properties:
        app_name: { type: string, minLength: 1 }
        revision: { type: string, minLength: 7, description: The GitOps-repo SHA being deployed. }
        sync_status: { type: [string, "null"] }
        operation_phase: { type: [string, "null"], description: Succeeded / Failed / Running. }
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        destination_namespace:
          type: [string, "null"]
          description: The namespace deployed into; its suffix after the last `-` is the environment.
        images:
          type: array
          items: { type: string }
          description: |
            Rendered images of the synced manifests
            (`.app.status.summary.images`), possibly empty. They match
            entries of `pipeline_events.image_refs` verbatim. Tags are versions: never
            parse a commit SHA out of one.

    NoerglerPrCompleted:
      type: object
      additionalProperties: false
      required:
        - event_type
        - outcome
        - pr_key
        - repo
        - source_commit_sha
        - lines_added
        - lines_removed
        - files_changed
        - total_runs
        - total_prompt_tokens
        - total_completion_tokens
        - total_elapsed_ms
        - total_findings_count
        - models_used
        - first_review_at
        - closed_at
      properties:
        event_type: { type: string, const: pr_completed }
        outcome:
          type: string
          enum: [merged, declined, deleted]
          description: Only merged PRs reach production.
        pr_key: { type: string, minLength: 1, description: "Bitbucket PR key, e.g. PROJ/repo#42." }
        repo: { type: string, minLength: 1 }
        reviewer_handle:
          type: [string, "null"]
          description: The git-host account the reviewer posts its comments under.
        reviewer_account_kind:
          $ref: "#/components/schemas/AccountKind"
          default: bot
        source_commit_sha: { type: string, minLength: 7 }
        merge_commit_sha:
          type: [string, "null"]
          minLength: 7
          description: Required when outcome is merged, null otherwise.
        lines_added: { type: integer, minimum: 0 }
        lines_removed: { type: integer, minimum: 0 }
        files_changed: { type: integer, minimum: 0 }
        total_runs: { type: integer, minimum: 1 }
        total_prompt_tokens: { type: integer, minimum: 0 }
        total_completion_tokens: { type: integer, minimum: 0 }
        total_elapsed_ms: { type: integer, minimum: 0 }
        total_findings_count: { type: integer, minimum: 0 }
        total_cost_usd:
          type: [number, string, "null"]
          description: |
            Aggregated review cost, below 1000000 with up to six decimals kept.
            Omit it when the run cannot be priced; never send 0, which would
            understate FinOps.
        models_used:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        first_review_at: { $ref: "#/components/schemas/Timestamp" }
        closed_at: { $ref: "#/components/schemas/Timestamp" }

    NoerglerFeedback:
      type: object
      additionalProperties: false
      required: [event_type, pr_key, finding_id, verdict, actor, occurred_at]
      properties:
        event_type: { type: string, const: feedback }
        pr_key: { type: string, minLength: 1 }
        finding_id:
          type: string
          minLength: 1
          description: Stable opaque id of the finding; not normalised.
        verdict: { type: string, enum: [disagreed, acknowledged] }
        actor: { type: string, minLength: 1 }
        repo: { type: [string, "null"], minLength: 1 }
        commit_sha: { type: [string, "null"], minLength: 7 }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }

    Instant:
      type: string
      format: date-time
      description: RFC 3339, UTC.

    NullableInstant:
      type: [string, "null"]
      format: date-time
      description: RFC 3339, UTC; null when it did not happen (yet).

    NullableNumber:
      type: [number, "null"]
      description: Null when there is nothing to compute it from.

    Seconds:
      type: number
      description: A duration in seconds.

    NullableSeconds:
      type: [number, "null"]
      description: A duration in seconds; null when unknown or negative.

    Spread:
      type: object
      description: A sample's size, median and 90th percentile (Postgres percentile_cont); null percentiles on no values.
      additionalProperties: false
      required: [n, p50, p90]
      properties:
        n: { type: integer, minimum: 0 }
        p50: { $ref: "#/components/schemas/NullableNumber" }
        p90: { $ref: "#/components/schemas/NullableNumber" }

    RunKind:
      type: string
      enum: [release, main, feature, other, unknown]
      description: |
        `release`: build_type release or hotfix; `main`: main branch, no
        release; `feature`: feature/…, bugfix/…, PR-…; `other`: any other
        branch; `unknown`: a main-branch run before the team's first
        build_type, release or not.

    Metrics:
      type: object
      additionalProperties: false
      required: [meta, period, products, product, bots, delivery, lead_chain, review, build, costs]
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
        period: { $ref: "#/components/schemas/Period" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        product:
          type: [string, "null"]
          description: The product shown; null for all, also when the one asked for has no data in the period.
        bots: { type: boolean, description: "Bots' PRs counted in, as asked." }
        delivery: { $ref: "#/components/schemas/Delivery" }
        lead_chain: { $ref: "#/components/schemas/LeadChain" }
        review: { $ref: "#/components/schemas/Review" }
        build: { $ref: "#/components/schemas/Build" }
        costs: { $ref: "#/components/schemas/Costs" }

    Period:
      type: object
      additionalProperties: false
      required: [from, to, weeks]
      properties:
        from: { $ref: "#/components/schemas/Instant" }
        to: { $ref: "#/components/schemas/Instant" }
        weeks:
          type: array
          description: The calendar weeks, oldest first; every weekly series has one value per week.
          items:
            type: object
            additionalProperties: false
            required: [start, end, kw]
            properties:
              start: { $ref: "#/components/schemas/Instant" }
              end: { $ref: "#/components/schemas/Instant" }
              kw: { type: integer, minimum: 1, maximum: 53, description: ISO 8601 week number. }

    Delivery:
      type: object
      additionalProperties: false
      required: [production_stage, pre_environment, frequency, lead_time, lead_time_pre]
      properties:
        production_stage: { type: string }
        pre_environment:
          type: [string, "null"]
          description: The stage before production the lead-time breakdown names, else the product's most deployed one.
        frequency: { $ref: "#/components/schemas/DeployFrequency" }
        lead_time: { $ref: "#/components/schemas/LeadTimes" }
        lead_time_pre:
          oneOf:
            - { $ref: "#/components/schemas/LeadTimes" }
            - { type: "null" }

    DeployFrequency:
      type: object
      description: Successful production syncs in the period, counted once per GitOps revision.
      additionalProperties: false
      required: [releases, syncs, first_seen, resyncs, per_week, low_sample, since, weeks, succeeded, failed,
                 finished, success_rate, argo_reporting]
      properties:
        releases: { type: integer, description: Revisions that brought new images. }
        syncs: { type: integer, description: All revisions. }
        first_seen: { type: integer, description: "Revisions that were some App's first deploy, no release." }
        resyncs: { type: integer, description: Revisions without new images. }
        per_week:
          type: number
          description: Releases per week over the period, or since `since`.
        low_sample:
          type: boolean
          description: "`per_week` rests on less than a week of Argo CD data."
        since:
          $ref: "#/components/schemas/NullableInstant"
          description: When Argo CD's data starts inside the period; null when it covers it.
        weeks:
          type: array
          description: Each revision in the week of its first deploy.
          items:
            type: object
            additionalProperties: false
            required: [release, sync, first_seen]
            properties:
              release: { type: integer }
              sync: { type: integer }
              first_seen: { type: integer }
        succeeded: { type: integer, description: "Successful syncs, not revisions." }
        failed: { type: integer }
        finished: { type: integer }
        success_rate: { $ref: "#/components/schemas/NullableNumber" }
        argo_reporting:
          type: boolean
          description: Argo CD reported for the team before the period's end.

    LeadTimes:
      type: object
      description: Per commit to its first deploy on the environment; merges and service accounts out, bots apart.
      additionalProperties: false
      required: [environment, human, bot, low_sample]
      properties:
        environment: { type: string }
        human: { $ref: "#/components/schemas/Spread" }
        bot: { $ref: "#/components/schemas/Spread" }
        low_sample: { type: boolean, description: "Fewer than 10 human commits, but some." }

    LeadChain:
      type: object
      description: The lead-time breakdown per human PR merged in the period.
      additionalProperties: false
      required: [stages, pre_environment, sum_p50, before_prod]
      properties:
        stages:
          type: array
          description: In order; `to_pre` only when there is a stage before production.
          items:
            type: object
            additionalProperties: false
            required: [key, n, p50, p90, low_sample, share, hot]
            properties:
              key: { type: string, enum: [coding, review, merge, to_pre, to_prod] }
              n: { type: integer }
              p50: { $ref: "#/components/schemas/NullableNumber" }
              p90: { $ref: "#/components/schemas/NullableNumber" }
              low_sample: { type: boolean, description: Fewer than 10 PRs. }
              share:
                $ref: "#/components/schemas/NullableNumber"
                description: The stage's part of the summed medians, 0..1; equal parts when all medians are 0.
              hot: { type: boolean, description: The stage with the largest median. }
        pre_environment: { type: [string, "null"] }
        sum_p50:
          $ref: "#/components/schemas/NullableNumber"
          description: Sum of the stage medians; null when no stage has data.
        before_prod:
          type: number
          description: Sum of the medians before the last stage.

    Review:
      type: object
      additionalProperties: false
      required: [cycle, review, approved, approved_on_first_touch, first_touch_rate, merged, untracked,
                 untracked_rate, cycle_histogram, change_mix]
      properties:
        cycle:
          $ref: "#/components/schemas/Spread"
          description: Opened to merged, human PRs merged in the period, GitOps repos out.
        review:
          $ref: "#/components/schemas/Spread"
          description: Ready to first human approval, the breakdown's review stage.
        approved: { type: integer }
        approved_on_first_touch: { type: integer }
        first_touch_rate: { $ref: "#/components/schemas/NullableNumber" }
        merged: { type: integer, description: "Merged PRs, bots per the filter." }
        untracked: { type: integer, description: "Of those, without a Jira key." }
        untracked_rate: { $ref: "#/components/schemas/NullableNumber" }
        cycle_histogram:
          type: object
          description: PRs per cycle-time bucket; one count more than bounds, the last bucket open.
          additionalProperties: false
          required: [upper_bounds_s, human, bot]
          properties:
            upper_bounds_s:
              type: array
              description: Each bucket's upper bound in seconds, exclusive, ascending.
              items: { type: number }
            human: { type: array, items: { type: integer } }
            bot: { type: array, items: { type: integer } }
        change_mix:
          type: array
          description: Merged PRs per week by branch prefix.
          items:
            type: object
            additionalProperties: false
            required: [feature, bugfix, hotfix, other]
            properties:
              feature: { type: integer }
              bugfix: { type: integer }
              hotfix: { type: integer }
              other: { type: integer }

    Build:
      type: object
      additionalProperties: false
      required: [data_from, starts_inside, gap_weeks, kinds, hotspots]
      properties:
        data_from:
          $ref: "#/components/schemas/NullableInstant"
          description: When riptide first received a run of the team.
        starts_inside: { type: boolean, description: "`data_from` falls after the period's start." }
        gap_weeks: { type: integer, description: Leading weeks that ended before `data_from`. }
        kinds:
          type: array
          description: Per kind of run with runs, never averaged across kinds.
          items: { $ref: "#/components/schemas/BuildStats" }
        hotspots: { $ref: "#/components/schemas/Hotspots" }

    BuildStats:
      type: object
      additionalProperties: false
      description: |
        One kind of run. A run without a verdict (see RunVerdict) is neither
        a failure nor a run, as in the hotspots: it counts in `no_verdict`
        and `ci_seconds` only, so `runs` = `succeeded` + `failed`.
      required: [kind, runs, succeeded, failed, no_verdict, success_rate, duration, ci_seconds, wasted_seconds,
                 weekly]
      properties:
        kind: { $ref: "#/components/schemas/RunKind" }
        runs: { type: integer, description: Runs with a verdict. }
        succeeded: { type: integer }
        failed: { type: integer }
        no_verdict: { type: integer, description: "ABORTED, NOT_BUILT, Tekton's None, ..." }
        success_rate: { $ref: "#/components/schemas/NullableNumber" }
        duration:
          $ref: "#/components/schemas/Spread"
          description: Over `runs`, those without a verdict left out.
        ci_seconds:
          $ref: "#/components/schemas/Seconds"
          description: Every run's time, those without a verdict included.
        wasted_seconds:
          $ref: "#/components/schemas/Seconds"
          description: Time of the failed runs.
        weekly:
          type: array
          description: Success rate per week; null for a week without runs.
          items: { $ref: "#/components/schemas/NullableNumber" }

    Hotspots:
      type: object
      description: |
        Repos against the team's baseline of the same kind of run, and runs
        far past it. A run without a verdict (see RunVerdict) counts as
        neither failure nor run.
      additionalProperties: false
      required: [min_runs, slow_factor, flaky_factor, outlier_factor, kinds, outliers]
      properties:
        min_runs: { type: integer, description: Runs a repo needs in a kind to be flagged. }
        slow_factor: { type: number, description: A repo median this many times the team's is slow. }
        flaky_factor:
          type: number
          description: A failure rate this many times the team's is flaky, at most halfway from the team's rate to 100 %.
        outlier_factor: { type: number, description: A run this many times its kind's team p90 is an outlier. }
        kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, duration, failure_rate, durations, failing, outlier_threshold_s]
            properties:
              kind: { $ref: "#/components/schemas/RunKind" }
              duration:
                $ref: "#/components/schemas/Spread"
                description: The team's, all repos of the kind.
              failure_rate: { $ref: "#/components/schemas/NullableNumber" }
              durations:
                type: array
                description: Repos by median duration, longest first, the top 8.
                items:
                  type: object
                  additionalProperties: false
                  required: [repo, runs, duration, factor, slow]
                  properties:
                    repo: { type: string }
                    runs: { type: integer }
                    duration: { $ref: "#/components/schemas/Spread" }
                    factor:
                      $ref: "#/components/schemas/NullableNumber"
                      description: The repo's median over the team's.
                    slow: { type: boolean }
              failing:
                type: array
                description: Repos with failed runs by wasted CI time, the top 8.
                items:
                  type: object
                  additionalProperties: false
                  required: [repo, runs, failures, failure_rate, wasted_seconds, flaky]
                  properties:
                    repo: { type: string }
                    runs: { type: integer, description: Runs with a verdict. }
                    failures: { type: integer }
                    failure_rate: { $ref: "#/components/schemas/NullableNumber" }
                    wasted_seconds: { $ref: "#/components/schemas/Seconds" }
                    flaky: { type: boolean }
              outlier_threshold_s:
                $ref: "#/components/schemas/NullableSeconds"
                description: Null below `min_runs` runs with a duration.
        outliers:
          type: array
          description: Runs past their kind's threshold across kinds, longest first, the top 10.
          items:
            type: object
            additionalProperties: false
            required: [kind, pipeline_name, repo, run_id, started_at, duration_s, status, factor]
            properties:
              kind: { $ref: "#/components/schemas/RunKind" }
              pipeline_name: { type: string }
              repo: { type: string }
              run_id: { type: string }
              started_at: { $ref: "#/components/schemas/NullableInstant" }
              duration_s: { $ref: "#/components/schemas/Seconds" }
              status: { type: [string, "null"] }
              factor: { type: number, description: The run's duration over its kind's team p90. }

    Costs:
      type: object
      description: noergler spend, final rollups closed in the period, in USD.
      additionalProperties: false
      required: [total, merged, merged_reviews, per_kloc, wasted, rows, reviewed_repos]
      properties:
        total: { type: number }
        merged: { type: number }
        merged_reviews: { type: integer }
        per_kloc:
          $ref: "#/components/schemas/NullableNumber"
          description: Per 1000 changed lines of merged PRs.
        wasted: { type: number, description: Spent on PRs declined or deleted. }
        rows:
          type: array
          description: By product (all products) or by repo (one product), largest first.
          items:
            type: object
            additionalProperties: false
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }
        reviewed_repos: { type: integer }

    Facts:
      type: object
      additionalProperties: false
      required: [production_stage, limit, prs, deploys, runs]
      properties:
        production_stage: { type: string }
        limit: { type: integer, description: Rows per table at most. }
        prs:
          type: object
          additionalProperties: false
          required: [count, rows]
          properties:
            count: { type: integer }
            rows: { type: array, items: { $ref: "#/components/schemas/PRFact" } }
        deploys:
          type: object
          additionalProperties: false
          required: [count, rows]
          properties:
            count: { type: integer }
            rows: { type: array, items: { $ref: "#/components/schemas/DeployFact" } }
        runs:
          type: object
          additionalProperties: false
          required: [count, rows]
          properties:
            count: { type: integer }
            rows: { type: array, items: { $ref: "#/components/schemas/RunFact" } }

    PRFact:
      type: object
      description: A PR opened or merged in the period, newest merge or opening first.
      additionalProperties: false
      required: [repo, pr_id, title, jira_prefix, gitops, bot, change_type, state, review_s, cycle_s, merged_at,
                 prod_at, to_prod_s]
      properties:
        repo: { type: string }
        pr_id: { type: integer }
        title: { type: [string, "null"] }
        jira_prefix: { type: string, description: "The Jira keys the title does not show, three at most." }
        gitops: { type: boolean, description: A GitOps repo's promotion PR. }
        bot: { type: boolean }
        change_type: { type: [string, "null"] }
        state: { type: string, enum: [open, merged, declined, deleted] }
        review_s: { $ref: "#/components/schemas/NullableSeconds" }
        cycle_s: { $ref: "#/components/schemas/NullableSeconds" }
        merged_at: { $ref: "#/components/schemas/NullableInstant" }
        prod_at:
          $ref: "#/components/schemas/NullableInstant"
          description: The merge commit's first production deploy.
        to_prod_s: { $ref: "#/components/schemas/NullableSeconds" }

    DeployFact:
      type: object
      description: A finished Argo CD sync in the period, newest first.
      additionalProperties: false
      required: [at, app, environment, revision, new_images, class, phase]
      properties:
        at: { $ref: "#/components/schemas/Instant" }
        app: { type: string }
        environment: { type: [string, "null"] }
        revision: { type: string }
        new_images: { type: array, items: { type: string } }
        class:
          type: string
          enum: [failed, release, first_seen, sync]
          description: What it counts as; `failed` for any phase but Succeeded.
        phase: { type: string, description: "Argo CD's operation phase: Succeeded, Failed, ..." }

    RunFact:
      type: object
      description: A finished CI run in the period, newest first.
      additionalProperties: false
      required: [pipeline_name, run_id, kind, commit_sha, duration_s, image_refs, status, verdict]
      properties:
        pipeline_name: { type: string }
        run_id: { type: string }
        kind: { $ref: "#/components/schemas/RunKind" }
        commit_sha: { type: [string, "null"] }
        duration_s: { type: [integer, "null"] }
        image_refs: { type: array, items: { type: string } }
        status: { type: [string, "null"], description: As the CI sent it. }
        verdict: { $ref: "#/components/schemas/RunVerdict" }

    RunVerdict:
      type: string
      enum: [success, failure, none]
      description: |
        What a run's status says about the build: `success` for SUCCESS
        (Jenkins), Succeeded or Completed (Tekton); `failure` for FAILURE,
        UNSTABLE (Jenkins) or Failed (Tekton); `none` for anything else
        (ABORTED, NOT_BUILT, Tekton's None), a run that ended without saying.

    Meta:
      type: object
      additionalProperties: false
      required: [team, from, to, generated_at, production_stage, data_start, data_end, build_data_from,
                 build_type_from]
      properties:
        team: { type: string }
        from: { $ref: "#/components/schemas/Instant" }
        to: { $ref: "#/components/schemas/Instant" }
        generated_at: { $ref: "#/components/schemas/Instant" }
        production_stage:
          type: string
          description: The config's production environment; the other `environment` values are earlier stages.
        data_start:
          $ref: "#/components/schemas/SourceTimes"
          description: The team's first event per source over all history.
        data_end:
          $ref: "#/components/schemas/SourceTimes"
          description: The team's latest event per source over all history, how fresh it is.
        build_data_from:
          $ref: "#/components/schemas/NullableInstant"
          description: When riptide first received a pipeline event for the team.
        build_type_from:
          $ref: "#/components/schemas/NullableInstant"
          description: |
            When riptide first received a pipeline event of the team carrying
            a build_type; null if none ever did. Before it, a run's null
            build_type means not collected yet; after it, the sender said
            nothing.

    SourceTimes:
      type: object
      description: One instant per source; null when the source never reported for the team.
      additionalProperties: false
      required: [bitbucket, pipeline, argocd, noergler]
      properties:
        bitbucket: { $ref: "#/components/schemas/NullableInstant" }
        pipeline: { $ref: "#/components/schemas/NullableInstant" }
        argocd: { $ref: "#/components/schemas/NullableInstant" }
        noergler: { $ref: "#/components/schemas/NullableInstant" }

    Product:
      type: object
      additionalProperties: false
      required: [key, repos, apps]
      properties:
        key: { type: string, description: "The Bitbucket project key, lowercased." }
        repos: { type: array, items: { type: string } }
        apps: { type: array, items: { type: string } }
