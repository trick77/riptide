# Splunk props.conf (reference)

Owned by the platform team; kept here so a change to the log shape can be checked
against what Splunk expects. Not applied by this repo.

```
[riptide:collector:json]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
KV_MODE          = json
TIME_PREFIX      = "timestamp":\s*"
TIME_FORMAT      = %Y-%m-%dT%H:%M:%S.%6NZ
TRUNCATE         = 0
```
